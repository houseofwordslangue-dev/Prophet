name: Sync media catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: media-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media indexer dependency
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Build real media catalogue
        env:
          PM_MEDIA_MAX_PER_SOURCE: '120'
          PM_AUTO_MEDIA_SYNC: '0'
        run: python media_sync.py
      - name: Validate catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/imported_media.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          rows=j.get('items',[])
          assert rows, 'media catalogue is empty'
          ids=[r.get('id') for r in rows]
          assert all(ids) and len(ids)==len(set(ids)), 'missing or duplicate media ids'
          playable=sum(bool(r.get('localUrl') or r.get('embed') or r.get('audio') or r.get('url')) for r in rows)
          assert playable==len(rows), f'{len(rows)-playable} rows have no playable source'
          print(f'validated {len(rows)} playable media rows')
          PY
      - name: Commit refreshed catalogue
        run: |
          if git diff --quiet -- data/imported_media.json private/media_sync_state.json; then
            echo 'No catalogue changes.'
            exit 0
          fi
          git config user.name 'Prophet Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/imported_media.json private/media_sync_state.json
          git commit -m 'Refresh verified media catalogue'
          git push
