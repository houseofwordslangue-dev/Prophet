name: Repair all biography gaps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_all_biography_gaps.py'
      - '.github/workflows/repair-all-biography-gaps.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair registry identity gaps
        run: python scripts/repair_all_biography_gaps.py

      - name: Re-run all-biography verified-source extension
        run: python scripts/extend_all_biographies_source_first.py

      - name: Refresh required biography registry
        run: python scripts/complete_required_biographies.py

      - name: Validate repaired state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/editorial/biography_gap_repair_audit.json').read_text(encoding='utf-8'))
          a=json.loads(Path('data/editorial/all_biographies_extension_audit.json').read_text(encoding='utf-8'))
          u=json.loads(Path('data/editorial/all_biographies_extension_unresolved.json').read_text(encoding='utf-8'))
          q=json.loads(Path('data/editorial/non_person_people_registry_quarantine.json').read_text(encoding='utf-8'))
          assert r['complete'] is True
          assert a['complete'] is True
          assert a['aiOriginalSubstantiveContentPercent']==0
          assert u['count']==a['unresolvedCount']
          assert q['count']==r['quarantinedNonPersonOrCompoundCount']
          assert a['peopleScanned']==r['afterValidPersonCount']
          print({'repair':r,'extension':a,'unresolved':u['count']})
          PY

      - name: Commit repaired biography state
        run: |
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- data/people.json data/editorial/non_person_people_registry_quarantine.json data/editorial/biography_gap_repair_audit.json data/editorial/biography-extensions data/editorial/canonical_biography_extensions.json data/editorial/all_biographies_extension_audit.json data/editorial/all_biographies_extension_unresolved.json data/editorial/required_biographies.json data/editorial/required_biographies_audit.json
          if git diff --cached --quiet; then
            echo 'No additional verified repairs.'
            exit 0
          fi
          git commit -m 'Repair biography registry gaps and rerun source enrichment'
          git pull --rebase origin main || true
          git push origin HEAD:main
