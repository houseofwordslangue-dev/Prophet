name: Add 50 new source-backed biographies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/add_50_new_source_biographies.py'
      - '.github/workflows/add-50-new-biographies.yml'

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate exactly 50 new source-backed biographies
        run: python scripts/add_50_new_source_biographies.py

      - name: Validate 50-biography expansion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/editorial/expanded_biographies_50_audit.json').read_text(encoding='utf-8'))
          assert a['target'] == 50
          assert a['added'] == 50
          assert a['duplicateAgainstExistingIds'] == 0
          assert a['duplicateAgainstExistingNames'] == 0
          assert a['duplicateWithinNewIds'] == 0
          assert a['duplicateWithinNewNames'] == 0
          assert a['sourceCoveragePercent'] == 100
          assert a['aiOriginalSubstantiveContentPercent'] == 0
          assert a['minimumSourceWords'] >= 120
          assert a['complete'] is True
          print(a)
          PY

      - name: Commit materialized biographies
        run: |
          if git diff --quiet -- data/people.json data/editorial/expanded_biographies_50_audit.json; then
            echo 'No materialized changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/people.json data/editorial/expanded_biographies_50_audit.json
          git commit -m 'Publish 50 new source-backed biographies'
          git push origin HEAD:main
