name: Genuine-source editorial autopublish

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-autopublish.yml'
      - 'scripts/editorial_autopublish.py'
      - 'scripts/extract_five_sections_500_v2.py'
      - 'data/editorial/drafts/**'
      - 'data/editorial_sections.json'
      - 'data/editorial/publication_supplement.json'
      - 'resources/library/processed/**'
      - 'data/ingested_library.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/extract_five_sections_500_v2.py'
      - 'data/editorial/drafts/**'
      - 'data/editorial/publication_supplement.json'

permissions:
  contents: write

concurrency:
  group: genuine-source-editorial-autopublish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'prophet-editorial-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build five exclusive Muhammad sections
        id: fivebuild
        shell: bash
        run: |
          mkdir -p data/editorial/audits
          set +e
          python scripts/extract_five_sections_500_v2.py > data/editorial/audits/five-sections-build.log 2>&1
          status=$?
          cat data/editorial/audits/five-sections-build.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist failed build diagnostic
        if: steps.fivebuild.outputs.exit_code != '0'
        run: |
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add data/editorial/audits/five-sections-build.log
          git commit -m 'Record five-section build diagnostic [skip ci]' || true
          git push || true
          exit 1

      - name: Validate exact five-section corpus
        if: steps.fivebuild.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          p=json.load(open('data/editorial/drafts/2026-08-22/five-sections-500.json',encoding='utf-8'))
          a=json.load(open('data/editorial/audits/five-sections-500-audit.json',encoding='utf-8'))
          c=Counter(x['section'] for x in p['drafts'])
          assert len(p['drafts']) == 500
          assert c == Counter({'light':100,'prophet':100,'messenger':100,'human':100,'mercy':100}), c
          assert min(x['sourceWordCount'] for x in p['drafts']) >= 1000
          assert len({x['sourceFingerprint'] for x in p['drafts']}) == 500
          assert all(x['sourceCoveragePercent']==100 and x['aiOriginalSubstantiveContentPercent']==0 for x in p['drafts'])
          assert a['status']=='PASS' and a['publishedArticles']==500
          print('PASS five sections:',c)
          PY

      - name: Commit five-section publication corpus
        if: steps.fivebuild.outputs.exit_code == '0'
        run: |
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add data/editorial/drafts/2026-08-22/five-sections-500.json \
                  data/editorial/audits/five-sections-500-audit.json \
                  data/editorial/audits/five-sections-build.log \
                  data/editorial/publication_manifest.json \
                  data/editorial/publication_supplement.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 100 exclusive articles per Muhammad section [skip ci]'
            git push
          fi

      - name: Validate genuine-source publication candidates
        if: steps.fivebuild.outputs.exit_code == '0'
        run: python scripts/editorial_autopublish.py --check
      - name: Publish all newly verified genuine-source drafts
        if: steps.fivebuild.outputs.exit_code == '0'
        run: python scripts/editorial_autopublish.py
      - name: Validate public editorial manifest
        if: steps.fivebuild.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('data/editorial/publication_manifest.json').read_text(encoding='utf-8'))
          a=d.get('automation') or {}; i=d.get('integrity') or {}
          assert d.get('status') == 'PUBLISHED' and a.get('enabled') is True
          assert int(i.get('aiGeneratedSubstantiveArticles',-1)) == 0
          assert int(i.get('unsupportedFactualParagraphs',-1)) == 0
          assert int(i.get('unverifiedQuotations',-1)) == 0
          assert int(i.get('articlesWith100PercentSourceProvenance',0)) == int(i.get('articlesPublished',-1))
          PY
      - name: Commit remaining publication-state changes
        if: steps.fivebuild.outputs.exit_code == '0'
        run: |
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add data/editorial/publication_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Autopublish newly verified genuine-source articles'
            git push
          fi
