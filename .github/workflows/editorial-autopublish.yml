# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
name: Genuine-source editorial autopublish

# Eight main editorial sections rotate across each 24-hour UTC cycle.
# One section is processed every three hours. Only source-grounded candidates
# that pass the strict provenance gate are published. Cadence/volume misses are
# recoverable diagnostics and never override source truth.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-autopublish.yml'
      - 'scripts/editorial_autopublish.py'
      - 'scripts/daily_rotating_editorial_fill.py'
      - 'scripts/build_100_genuine_articles.py'
      - 'data/editorial/drafts/**'
      - 'data/editorial_sections.json'
      - 'data/editorial/publication_supplement.json'
      - 'resources/library/processed/**'
      - 'data/ingested_library.json'
      - 'MASTER-OVERRIDING-SITE-INSTRUCTION.md'

permissions:
  contents: write

concurrency:
  group: genuine-source-editorial-autopublish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'prophet-editorial-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce controlling master
        run: python scripts/audit_current_instructions.py

      - name: Validate existing genuine-source publication candidates
        run: python scripts/editorial_autopublish.py --check

      - name: Create next rotating daily section article
        id: rotate
        continue-on-error: true
        run: python scripts/daily_rotating_editorial_fill.py

      - name: Record rotation result without failing on missing source
        if: always()
        shell: bash
        run: |
          echo '### Daily editorial rotation' >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.rotate.outcome }}' = 'failure' ]; then
            echo 'The rotating extractor encountered a recoverable processing problem. Existing verified content remains published.' >> "$GITHUB_STEP_SUMMARY"
            echo 'No article is fabricated to satisfy cadence; the next cycle retries from available sources.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Rotation completed. If a new verified source candidate was found, it is passed to strict autopublish.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Strict source/provenance check after rotation
        run: python scripts/editorial_autopublish.py --check

      - name: Publish all newly verified genuine-source records
        run: python scripts/editorial_autopublish.py

      - name: Validate hard integrity invariants
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/editorial/publication_manifest.json')
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          a=d.get('automation') or {}; i=d.get('integrity') or {}
          assert a.get('enabled') is True
          assert int(i.get('aiGeneratedSubstantiveArticles',-1)) == 0
          assert int(i.get('unsupportedFactualParagraphs',-1)) == 0
          assert int(i.get('unverifiedQuotations',-1)) == 0
          assert int(i.get('articlesWith100PercentSourceProvenance',0)) == int(i.get('articlesPublished',-1))
          print('HARD INTEGRITY PASS')
          PY

      - name: Commit rotation and publication state
        run: |
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add data/editorial/drafts data/editorial/daily_rotation_audit.json data/editorial/publication_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Daily rotating source-grounded editorial fill [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
