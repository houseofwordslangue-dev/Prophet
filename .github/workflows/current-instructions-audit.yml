# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
name: Current Instructions Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-instructions-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit current standing instructions
        run: python scripts/audit_current_instructions.py
      - name: Enforce canonical master governance
        run: python scripts/check_master_governance.py
