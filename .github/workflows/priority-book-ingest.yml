name: Priority requested book ingestion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/priority-book-ingest.yml'
      - 'private/priority_ingest_ids.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prophet-priority-book-ingest
  cancel-in-progress: false

jobs:
  ingest-priority:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Isolate exactly the requested resources
        run: |
          cp private/acquisition_candidates.json /tmp/acquisition_candidates.full.json
          python - <<'PY'
          import json, pathlib
          qpath=pathlib.Path('private/acquisition_candidates.json')
          ppath=pathlib.Path('private/priority_ingest_ids.json')
          q=json.loads(qpath.read_text(encoding='utf-8'))
          p=json.loads(ppath.read_text(encoding='utf-8'))
          ids=[str(x) for x in p.get('workIds',[])]
          if len(ids)!=10 or len(set(ids))!=10:
              raise SystemExit(f'FAIL: priority list must contain exactly 10 unique work IDs, got {len(ids)}')
          lookup={str(x.get('workId') or ''):x for x in q.get('items',[])}
          missing=[x for x in ids if x not in lookup]
          if missing:
              raise SystemExit('FAIL: requested IDs missing from acquisition queue: '+', '.join(missing))
          q['items']=[lookup[x] for x in ids]
          q['priorityBatch']=ids
          qpath.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          idx=pathlib.Path('data/ingested_library.json')
          if idx.exists():
              d=json.loads(idx.read_text(encoding='utf-8'))
              d['items']=[x for x in d.get('items',[]) if str(x.get('workId') or '') not in set(ids)]
              d['count']=len(d['items'])
              idx.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('priority IDs:',ids)
          PY

      - name: Download the requested 10 resources
        run: python scripts/acquire_unrestricted_library.py --limit 10

      - name: Build cumulative reader/search/listen index
        run: python scripts/build_ingested_library.py

      - name: Validate all requested resources were downloaded
        run: |
          python - <<'PY'
          import json, pathlib
          ids=json.loads(pathlib.Path('private/priority_ingest_ids.json').read_text(encoding='utf-8'))['workIds']
          state=json.loads(pathlib.Path('private/acquisition_state.json').read_text(encoding='utf-8'))
          index=json.loads(pathlib.Path('data/ingested_library.json').read_text(encoding='utf-8'))
          state_by={str(x.get('workId') or ''):x for x in state.get('items',[])}
          index_ids={str(x.get('workId') or '') for x in index.get('items',[])}
          failures=[]
          for wid in ids:
              row=state_by.get(wid,{})
              files=list(pathlib.Path('library/works',wid).glob('editions/*/original.*'))
              if row.get('status')!='DOWNLOADED' or not files or wid not in index_ids:
                  failures.append({'workId':wid,'status':row.get('status'),'error':row.get('error'),'files':len(files),'indexed':wid in index_ids})
          print('requested:',len(ids),'failures:',failures)
          if failures:
              raise SystemExit('FAIL: not all 10 requested resources downloaded/indexed')
          print('PASS: all 10 requested resources downloaded and indexed')
          PY

      - name: Restore full acquisition queue
        if: always()
        run: cp /tmp/acquisition_candidates.full.json private/acquisition_candidates.json

      - name: Commit actual book files, state and public index to GitHub
        run: |
          git config user.name 'prophet-ingestion-bot'
          git config user.email 'prophet-ingestion-bot@users.noreply.github.com'
          git add -- private/acquisition_state.json data/ingested_library.json library/works
          if ! git diff --cached --quiet; then
            git commit -m "Ingest requested 10 resources into GitHub library"
            git push
          fi

      - name: Deploy the requested books and index to site
        env:
          PM_DEPLOY_HOST: ${{ secrets.PM_DEPLOY_HOST }}
          PM_DEPLOY_USER: ${{ secrets.PM_DEPLOY_USER }}
          PM_DEPLOY_PATH: ${{ secrets.PM_DEPLOY_PATH }}
          PM_DEPLOY_SSH_KEY: ${{ secrets.PM_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$PM_DEPLOY_HOST" ] || [ -z "$PM_DEPLOY_USER" ] || [ -z "$PM_DEPLOY_PATH" ] || [ -z "$PM_DEPLOY_SSH_KEY" ]; then
            echo "Deployment secrets not configured; GitHub book commit completed, site upload skipped."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PM_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PM_DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$PM_DEPLOY_USER@$PM_DEPLOY_HOST" "mkdir -p '$PM_DEPLOY_PATH/data' '$PM_DEPLOY_PATH/library/works'"
          rsync -az data/ingested_library.json "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/data/ingested_library.json"
          rsync -az library/works/ "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/library/works/"
