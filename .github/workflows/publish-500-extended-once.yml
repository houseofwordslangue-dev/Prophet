# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
name: Publish 500 extended source articles once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-500-extended-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified 500 extended source articles
        run: python scripts/build_next_500_extended_articles.py
      - name: Validate publication audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/editorial/source_extract_500_extended_20260822_audit.json').read_text(encoding='utf-8'))
          assert a['publishedArticles']==500
          assert a['sourceCoveragePercent']==100
          assert a['aiOriginalSubstantiveContentPercent']==0
          assert a['duplicateSourceBodies']==0
          assert len(a['publicationBatchPaths'])==10
          assert sum(len(json.loads(Path(p).read_text(encoding='utf-8'))['drafts']) for p in a['publicationBatchPaths'])==500
          print('500 extended article publication audit PASS')
          PY
      - name: Commit published batches
        run: |
          git config user.name 'prophet-publication-bot'
          git config user.email 'prophet-publication-bot@users.noreply.github.com'
          git add data/editorial/drafts/2026-08-22/batch-31.json data/editorial/drafts/2026-08-22/batch-32.json data/editorial/drafts/2026-08-22/batch-33.json data/editorial/drafts/2026-08-22/batch-34.json data/editorial/drafts/2026-08-22/batch-35.json data/editorial/drafts/2026-08-22/batch-36.json data/editorial/drafts/2026-08-22/batch-37.json data/editorial/drafts/2026-08-22/batch-38.json data/editorial/drafts/2026-08-22/batch-39.json data/editorial/drafts/2026-08-22/batch-40.json data/editorial/publication_supplement.json data/editorial/source_extract_500_extended_20260822_audit.json service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 500 extended source-grounded articles'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
