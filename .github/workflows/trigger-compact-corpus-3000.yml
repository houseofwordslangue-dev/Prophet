name: Trigger compact corpus publication

on:
  pull_request:
    paths:
      - '.github/workflows/trigger-compact-corpus-3000.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch compact publication workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-compact-corpus-3000.yml --repo "$GITHUB_REPOSITORY" --ref main
