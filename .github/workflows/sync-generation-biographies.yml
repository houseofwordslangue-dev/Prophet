name: Sync generation biographies

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generation-biography-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip generation-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source-backed biographies
        run: python scripts/sync_generation_biographies.py
      - name: Commit generated corpus
        run: |
          if git diff --quiet -- data/generations GENERATION_BIOGRAPHY_REPORT.json; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generations GENERATION_BIOGRAPHY_REPORT.json
          git commit -m "Generate source-extracted Tābiʿīn and Atbāʿ biographies [skip generation-sync]"
          git push
