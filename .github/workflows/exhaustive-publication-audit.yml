name: Exhaustive publication audit

# Governed by MASTER_OVERRIDING_INSTRUCTION.md.
# This workflow inventories publication gaps but does not treat ordinary
# incompleteness, enrichment backlog, or numerical targets as hard CI failures.
# Hard authenticity/provenance/functionality gates remain enforced by their
# dedicated workflows.
on:
  push:
    paths:
      - 'data/editorial/**'
      - 'data/children/**'
      - 'data/catalogue/**'
      - 'data/*.json'
      - '*.html'
      - 'scripts/exhaustive_publication_audit.py'
      - 'MASTER_OVERRIDING_INSTRUCTION.md'
      - '.github/workflows/exhaustive-publication-audit.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate file-by-file and resource-by-resource audit
        id: audit
        continue-on-error: true
        run: python scripts/exhaustive_publication_audit.py
      - name: Summarize audit under overriding master instruction
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.audit.outcome }}' = 'failure' ]; then
            echo '### Exhaustive publication audit' >> "$GITHUB_STEP_SUMMARY"
            echo 'Publication/enrichment gaps were found and retained for repair.' >> "$GITHUB_STEP_SUMMARY"
            echo 'These are not CI hard failures unless a dedicated authenticity, provenance, security, or functionality gate fails.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Exhaustive publication audit: PASS' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-publication-audit
          path: |
            data/audits/exhaustive-publication-audit.generated.json
            data/audits/exhaustive-publication-audit.generated.md
          if-no-files-found: ignore
          retention-days: 7
