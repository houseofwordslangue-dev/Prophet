name: Add 135 more source biographies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/add_135_more_source_biographies.py'
      - '.github/workflows/add-135-more-biographies.yml'

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exactly 135 new source-backed biographies
        run: python scripts/add_135_more_source_biographies.py
      - name: Validate expansion audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/editorial/expanded_biographies_135_audit.json').read_text(encoding='utf-8'))
          assert a['target']==135
          assert a['added']==135
          assert a['projectedCanonicalTotal']>=270
          assert a['duplicateAgainstPreviousIds']==0
          assert a['duplicateWithinNewIds']==0
          assert a['sourceCoveragePercent']==100
          assert a['aiOriginalSubstantiveContentPercent']==0
          assert a['minimumSourceWords']>=120
          assert a['complete'] is True
          print(a)
          PY
      - name: Commit materialized biographies
        run: |
          if git diff --quiet -- data/people.json data/editorial/expanded_biographies_135_audit.json; then
            echo 'No materialized changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/people.json data/editorial/expanded_biographies_135_audit.json
          git commit -m 'Publish 135 additional source-backed biographies'
          git push origin HEAD:main
