name: Audit empty biographies
on:
  pull_request:
    paths:
      - 'scripts/audit_empty_person_biographies.py'
      - 'scripts/extract_required_biography_repairs.py'
      - 'scripts/mine_empty_biography_source_articles.py'
      - '.github/workflows/audit-empty-biographies.yml'
      - 'data/editorial/required_biographies.json'
      - 'data/people.json'
      - 'data/family_people.json'
      - 'data/family_groups.json'
      - 'data/family_biographies.json'
      - 'data/family_biographies_all.*.b64'
      - 'data/editorial/drafts/**/*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extract restored dossier evidence
        run: python scripts/extract_required_biography_repairs.py
      - name: Mine existing source articles
        run: python scripts/mine_empty_biography_source_articles.py
      - name: Audit rendered biography coverage
        run: python scripts/audit_empty_person_biographies.py
      - name: Upload audit and repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: empty-biographies-audit
          path: |
            data/editorial/empty_biographies_audit.json
            data/editorial/person_biography_repairs_raw.json
            data/editorial/empty_biography_source_candidates.json
          if-no-files-found: error
