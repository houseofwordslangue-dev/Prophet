# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
name: Restore canonical workflow set

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-canonical-workflows.yml'
      - 'MASTER-OVERRIDING-SITE-INSTRUCTION.md'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-enable current canonical workflows only
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            '.github/workflows/master-governance.yml' \
            '.github/workflows/current-instructions-audit.yml' \
            '.github/workflows/public-content-source-audit.yml' \
            '.github/workflows/reader-player-ops.yml' \
            '.github/workflows/reader-player-regression.yml' \
            '.github/workflows/exhaustive-publication-audit.yml' \
            '.github/workflows/daily-generative-control.yml' \
            '.github/workflows/content-completion.yml' \
            '.github/workflows/editorial-autopublish.yml'; do
            id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --jq ".workflows[] | select(.path == \"$path\") | .id" | head -n1)
            if [ -n "$id" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/enable" >/dev/null
              echo "enabled $path"
            else
              echo "not found: $path"
            fi
          done
