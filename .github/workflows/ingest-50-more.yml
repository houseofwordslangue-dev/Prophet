name: Ingest 50 more books

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/recovery/retained_search_batch_3.json'
      - 'scripts/ingest_50_more.py'
      - '.github/workflows/ingest-50-more.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BATCH3_TARGET: '50'
      BATCH3_MAX_FILE_BYTES: '99614720'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and ingest fifty public-domain books
        run: python scripts/ingest_50_more.py
      - name: Commit ingestion result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-library-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/ingested_library.json data/recovery/retained_search_batch_3_report.json library/works
          if git diff --cached --quiet; then
            echo 'No new assets.'
            exit 0
          fi
          git commit -m 'Ingest 50 additional public-domain books'
          git push origin HEAD:main
