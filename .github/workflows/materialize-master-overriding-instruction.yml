name: Materialize authoritative master instruction

on:
  push:
    paths:
      - '.master-payload/**'
      - '.github/workflows/materialize-master-overriding-instruction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct authoritative master file
        shell: bash
        run: |
          set -euo pipefail
          cat .master-payload/01.b64 .master-payload/02.b64 .master-payload/03.b64 .master-payload/04.b64 .master-payload/05.b64 .master-payload/06.b64 > /tmp/master.b64
          base64 -d /tmp/master.b64 | gzip -dc > MASTER-OVERRIDING-INSTRUCTION.md

      - name: Validate complete sections 1 through 101
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('MASTER-OVERRIDING-INSTRUCTION.md')
          text = p.read_text(encoding='utf-8')
          assert text.startswith('MASTER OVERRIDING INSTRUCTION\n'), 'missing master heading'
          missing = [n for n in range(1, 102) if not re.search(rf'(?m)^\s*{n}\.\s+', text)]
          assert not missing, f'missing sections: {missing}'
          headers = [int(x) for x in re.findall(r'(?m)^\s*(\d+)\.\s+', text) if 1 <= int(x) <= 101]
          for n in range(1, 102):
              assert headers.count(n) == 1, f'section {n} appears {headers.count(n)} times'
          assert 'CONTENT, NOT COMMENTARY.' in text
          assert 'READER EXPERIENCE, NOT DEVELOPMENT METADATA.' in text
          assert len(text.splitlines()) >= 2600, 'unexpectedly short master instruction'
          print(f'Validated {len(text.splitlines())} lines; sections 1-101 complete and unique.')

      - name: Declare the master file authoritative in README
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          block = '''## Controlling master instruction\n\n`MASTER-OVERRIDING-INSTRUCTION.md` is the single authoritative, overwriting governance prompt for this repository. It contains the complete controlling instruction (sections 1–101). If another prompt, policy, workflow note, manifest, cache, generated ledger, or older master file conflicts with it, `MASTER-OVERRIDING-INSTRUCTION.md` prevails. Supporting policy files remain implementation references only and must be interpreted consistently with the master instruction.\n\n'''
          if '## Controlling master instruction' in text:
              start = text.index('## Controlling master instruction')
              nxt = text.find('\n## ', start + 3)
              text = text[:start] + block + (text[nxt+1:] if nxt != -1 else '')
          else:
              marker = '\n## Editorial integrity\n'
              if marker in text:
                  text = text.replace(marker, '\n' + block + '## Editorial integrity\n', 1)
              else:
                  text = text.rstrip() + '\n\n' + block
          text = text.replace(
              'Editorial articles are governed by `EDITORIAL-GENUINE-SOURCE-POLICY.md` and `data/editorial_policy.json`.',
              'Editorial implementation is supported by `EDITORIAL-GENUINE-SOURCE-POLICY.md` and `data/editorial_policy.json`, subject to `MASTER-OVERRIDING-INSTRUCTION.md`.'
          )
          p.write_text(text, encoding='utf-8')

      - name: Remove temporary payload fragments
        shell: bash
        run: rm -rf .master-payload

      - name: Commit authoritative master instruction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER-OVERRIDING-INSTRUCTION.md README.md .master-payload
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add single authoritative master overriding instruction [skip ci]'
          git push
