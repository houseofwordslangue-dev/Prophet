name: Dedicated rotating book ingestion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/book-ingest.yml'
      - 'private/acquisition_candidates.json'
      - 'scripts/acquire_unrestricted_library.py'
      - 'scripts/source_first_fulltext_resolver.py'
      - 'scripts/discover_native_open_sources.py'
      - 'scripts/reconcile_fulltext_catalog.py'
      - 'data/source_first_fulltext_policy.json'
      - 'data/drive_native_assets_20260822.json'
      - 'scripts/promote_verified_catalogue_candidates.py'
      - 'scripts/discover_gutenberg_resources.py'
      - 'scripts/build_ingested_library.py'
      - 'data/catalogue/**'
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      books:
        description: Books to acquire per cycle
        required: false
        default: '40'

permissions:
  contents: write

concurrency:
  group: prophet-dedicated-book-ingest
  cancel-in-progress: false

jobs:
  books:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PM_BOOK_BATCH: ${{ inputs.books || '40' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve known EPUB text Word and native formats before OCR
        run: python scripts/source_first_fulltext_resolver.py
      - name: Deep-search open native editions before OCR
        continue-on-error: true
        run: python scripts/discover_native_open_sources.py --limit 80
      - name: Discover additional official Gutenberg resources
        continue-on-error: true
        run: python scripts/discover_gutenberg_resources.py --limit 40
      - name: Promote rights-cleared exact catalogue sources
        continue-on-error: true
        run: python scripts/promote_verified_catalogue_candidates.py --limit 100
      - name: Acquire next unpublished native book batch on GitHub runner
        run: python scripts/acquire_unrestricted_library.py --limit "$PM_BOOK_BATCH"
      - name: Build cumulative reader/search/listen index
        run: python scripts/build_ingested_library.py
      - name: Enable newly acquired full text in public catalogue
        run: python scripts/reconcile_fulltext_catalog.py
      - name: Validate acquisition outputs
        run: |
          python - <<'PY'
          import json, pathlib
          state=pathlib.Path('private/acquisition_state.json')
          index=pathlib.Path('data/ingested_library.json')
          resolution=pathlib.Path('private/source_first_resolution.json')
          catalog=pathlib.Path('data/public_catalog_all.generated.json')
          if not resolution.exists(): raise SystemExit('FAIL: native-source search did not run')
          if not state.exists(): raise SystemExit('FAIL: acquisition state missing')
          if not index.exists(): raise SystemExit('FAIL: ingested library index missing')
          if not catalog.exists(): raise SystemExit('FAIL: public catalogue missing')
          r=json.loads(resolution.read_text(encoding='utf-8'))
          s=json.loads(state.read_text(encoding='utf-8'))
          d=json.loads(index.read_text(encoding='utf-8'))
          c=json.loads(catalog.read_text(encoding='utf-8'))
          if any(not x.get('nativeSearchCompleted') for x in r.get('items',[])):
              raise SystemExit('FAIL: OCR/full-text pipeline attempted before native-source search completed')
          print('native-source records:',len(r.get('items',[])))
          print('native text found:',r.get('nativeTextFound',0))
          print('state records:',len(s.get('items',[])))
          print('published index:',d.get('count',0))
          print('public full text:',c.get('counts',{}).get('PUBLIC_FULL_TEXT',0))
          print('remaining full text:',c.get('total',0)-c.get('counts',{}).get('PUBLIC_FULL_TEXT',0))
          PY
      - name: Commit cumulative queue, source-first state and public index
        run: |
          git config user.name 'prophet-ingestion-bot'
          git config user.email 'prophet-ingestion-bot@users.noreply.github.com'
          git add -- private/acquisition_candidates.json private/acquisition_state.json private/source_first_resolution.json private/native_discovery_state.json data/ingested_library.json data/public_catalog_all.generated.json data/audits/exhaustive-publication-audit-current.json
          if ! git diff --cached --quiet; then
            git commit -m "Acquire and enable verified native-format book rotation"
            git push
          fi
      - name: Deploy new books and cumulative index to site
        env:
          PM_DEPLOY_HOST: ${{ secrets.PM_DEPLOY_HOST }}
          PM_DEPLOY_USER: ${{ secrets.PM_DEPLOY_USER }}
          PM_DEPLOY_PATH: ${{ secrets.PM_DEPLOY_PATH }}
          PM_DEPLOY_SSH_KEY: ${{ secrets.PM_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$PM_DEPLOY_HOST" ] || [ -z "$PM_DEPLOY_USER" ] || [ -z "$PM_DEPLOY_PATH" ] || [ -z "$PM_DEPLOY_SSH_KEY" ]; then
            echo "Deployment secrets not configured; GitHub acquisition/index commit completed, site upload skipped."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PM_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PM_DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$PM_DEPLOY_USER@$PM_DEPLOY_HOST" "mkdir -p '$PM_DEPLOY_PATH/data' '$PM_DEPLOY_PATH/library/works'"
          rsync -az data/ingested_library.json data/public_catalog_all.generated.json data/audits/exhaustive-publication-audit-current.json "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/data/"
          if [ -d library/works ]; then
            rsync -az library/works/ "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/library/works/"
          fi
