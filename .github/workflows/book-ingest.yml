# GOVERNED_BY: MASTER_OVERRIDING_INSTRUCTION.md
name: Dedicated rotating book ingestion

# Source discovery/download failures are retryable. They must never degrade or
# delete already verified material and therefore do not fail the whole workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/book-ingest.yml'
      - 'private/acquisition_candidates.json'
      - 'scripts/acquire_unrestricted_library.py'
      - 'scripts/source_first_fulltext_resolver.py'
      - 'scripts/discover_native_open_sources.py'
      - 'scripts/reconcile_fulltext_catalog.py'
      - 'data/source_first_fulltext_policy.json'
      - 'data/drive_native_assets_20260822.json'
      - 'scripts/promote_verified_catalogue_candidates.py'
      - 'scripts/discover_gutenberg_resources.py'
      - 'scripts/build_ingested_library.py'
      - 'data/catalogue/**'
      - 'MASTER_OVERRIDING_INSTRUCTION.md'
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      books:
        description: Books to acquire per cycle
        required: false
        default: '40'

permissions:
  contents: write

concurrency:
  group: prophet-dedicated-book-ingest
  cancel-in-progress: false

jobs:
  books:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PM_BOOK_BATCH: ${{ inputs.books || '40' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve known native formats before OCR
        id: resolve
        continue-on-error: true
        run: python scripts/source_first_fulltext_resolver.py

      - name: Deep-search open native editions before OCR
        id: native
        continue-on-error: true
        run: python scripts/discover_native_open_sources.py --limit 80

      - name: Discover additional official Gutenberg resources
        id: gutenberg
        continue-on-error: true
        run: python scripts/discover_gutenberg_resources.py --limit 40

      - name: Promote rights-cleared exact catalogue sources
        id: promote
        continue-on-error: true
        run: python scripts/promote_verified_catalogue_candidates.py --limit 100

      - name: Acquire next verified unpublished native book batch
        id: acquire
        continue-on-error: true
        run: python scripts/acquire_unrestricted_library.py --limit "$PM_BOOK_BATCH"

      - name: Build cumulative reader search listen index
        id: index
        continue-on-error: true
        run: python scripts/build_ingested_library.py

      - name: Enable newly acquired verified full text in public catalogue
        id: reconcile
        continue-on-error: true
        run: python scripts/reconcile_fulltext_catalog.py

      - name: Validate available acquisition outputs without degrading prior state
        id: validate
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib
          files={
            'resolution':pathlib.Path('private/source_first_resolution.json'),
            'state':pathlib.Path('private/acquisition_state.json'),
            'index':pathlib.Path('data/ingested_library.json'),
            'catalog':pathlib.Path('data/public_catalog_all.generated.json'),
          }
          for name,p in files.items():
            if not p.exists():
              print('RETRYABLE_MISSING',name,p)
              continue
            try:
              d=json.loads(p.read_text(encoding='utf-8'))
              print('VALID_JSON',name)
            except Exception as exc:
              print('INVALID_OUTPUT_NOT_COMMITTED',name,exc)
          print('Validation is diagnostic; prior verified repository state is preserved on incomplete cycles.')
          PY

      - name: Commit only successfully materialized queue/index changes
        run: |
          git config user.name 'prophet-ingestion-bot'
          git config user.email 'prophet-ingestion-bot@users.noreply.github.com'
          for p in private/acquisition_candidates.json private/acquisition_state.json private/source_first_resolution.json private/native_discovery_state.json data/ingested_library.json data/public_catalog_all.generated.json data/audits/exhaustive-publication-audit-current.json; do
            [ -e "$p" ] && git add -- "$p"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Acquire and enable verified native-format book rotation [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Deploy new books and cumulative index when configured
        continue-on-error: true
        env:
          PM_DEPLOY_HOST: ${{ secrets.PM_DEPLOY_HOST }}
          PM_DEPLOY_USER: ${{ secrets.PM_DEPLOY_USER }}
          PM_DEPLOY_PATH: ${{ secrets.PM_DEPLOY_PATH }}
          PM_DEPLOY_SSH_KEY: ${{ secrets.PM_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$PM_DEPLOY_HOST" ] || [ -z "$PM_DEPLOY_USER" ] || [ -z "$PM_DEPLOY_PATH" ] || [ -z "$PM_DEPLOY_SSH_KEY" ]; then
            echo "Deployment secrets not configured; repository state retained and deployment skipped."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PM_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PM_DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$PM_DEPLOY_USER@$PM_DEPLOY_HOST" "mkdir -p '$PM_DEPLOY_PATH/data' '$PM_DEPLOY_PATH/library/works'"
          for p in data/ingested_library.json data/public_catalog_all.generated.json data/audits/exhaustive-publication-audit-current.json; do
            [ -e "$p" ] && rsync -az "$p" "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/data/"
          done
          if [ -d library/works ]; then
            rsync -az library/works/ "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/library/works/"
          fi

      - name: Summarize retryable ingestion cycle
        if: always()
        run: |
          echo '### Rotating book ingestion' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source/network misses are retryable and do not degrade previously verified material.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only successfully materialized verified changes are committed.' >> "$GITHUB_STEP_SUMMARY"
