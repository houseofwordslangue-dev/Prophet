# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
name: Publish production site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-production.yml'

permissions:
  contents: read

concurrency:
  group: prophet-production-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PM_DEPLOY_HOST: ${{ secrets.PM_DEPLOY_HOST }}
      PM_DEPLOY_USER: ${{ secrets.PM_DEPLOY_USER }}
      PM_DEPLOY_PATH: ${{ secrets.PM_DEPLOY_PATH }}
      PM_DEPLOY_SSH_KEY: ${{ secrets.PM_DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate publication prerequisites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('data/editorial/required_biographies_audit.json').read_text(encoding='utf-8'))
          repair=json.loads(Path('data/editorial/biography_gap_repair_audit.json').read_text(encoding='utf-8'))
          assert req['complete'] is True
          assert req['missingCanonicalBiographyCount'] == 0
          assert repair['complete'] is True
          print('Publication gate PASS:', req['canonicalCompleteCount'], 'required biographies; valid people', repair['afterValidPersonCount'])
          PY

      - name: Require production deployment contract
        run: |
          test -n "$PM_DEPLOY_HOST" || { echo 'PM_DEPLOY_HOST missing'; exit 1; }
          test -n "$PM_DEPLOY_USER" || { echo 'PM_DEPLOY_USER missing'; exit 1; }
          test -n "$PM_DEPLOY_PATH" || { echo 'PM_DEPLOY_PATH missing'; exit 1; }
          test -n "$PM_DEPLOY_SSH_KEY" || { echo 'PM_DEPLOY_SSH_KEY missing'; exit 1; }

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PM_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PM_DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Publish site files
        run: |
          ssh "$PM_DEPLOY_USER@$PM_DEPLOY_HOST" "mkdir -p '$PM_DEPLOY_PATH' '$PM_DEPLOY_PATH/data' '$PM_DEPLOY_PATH/assets'"
          rsync -az --exclude '.git/' --exclude '.github/' --exclude '.env' --exclude 'backups/' --exclude 'media-cache/' --exclude 'private/' --exclude '__pycache__/' --exclude '*.pyc' ./ "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/"

      - name: Verify deployed readiness
        run: |
          ssh "$PM_DEPLOY_USER@$PM_DEPLOY_HOST" "test -f '$PM_DEPLOY_PATH/server.py' && test -f '$PM_DEPLOY_PATH/data/people.json' && test -f '$PM_DEPLOY_PATH/data/editorial/required_biographies_audit.json'"
          echo "Production files published successfully."
