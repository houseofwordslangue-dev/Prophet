name: Ingest Arabic top-up books

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/recovery/arabic_topup_batch.json'
      - 'scripts/ingest_arabic_topup.py'
      - '.github/workflows/ingest-arabic-topup.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ARABIC_TOPUP_TARGET: '49'
      ARABIC_TOPUP_MAX_FILE_BYTES: '99614720'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebase recovery work on latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Resolve Arabic catalogue and ingest top-up
        run: python scripts/ingest_arabic_topup.py
      - name: Publish recovered assets through isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-library-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/ingested_library.json data/recovery/arabic_topup_batch_report.json library/works
          if git diff --cached --quiet; then
            echo 'No top-up changes.'
            exit 0
          fi
          git commit -m 'Ingest Arabic recovery top-up books'
          OUT="bot/arabic-topup-${GITHUB_RUN_ID}"
          git push origin HEAD:"$OUT"
          PR_URL=$(gh pr create --base main --head "$OUT" --title 'Ingest Arabic recovery top-up books' --body 'Automated recovery output for the remaining 49-book ingestion target. Contains only successfully downloaded/indexed assets from the Arabic professional catalogue and exact retained Archive.org identifiers.')
          gh pr merge "$PR_URL" --squash --delete-branch
