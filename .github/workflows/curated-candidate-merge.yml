name: Merge curated acquisition candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curated-candidate-merge.yml'
      - 'private/curated_candidates_*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prophet-curated-candidate-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.actor != 'prophet-ingestion-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge curated records into primary acquisition queue
        run: |
          python - <<'PY'
          import glob, json, pathlib
          primary = pathlib.Path('private/acquisition_candidates.json')
          data = json.loads(primary.read_text(encoding='utf-8'))
          items = data.setdefault('items', [])
          seen_work = {str(x.get('workId') or '') for x in items}
          seen_source = {str(x.get('sourceIdentifier') or '') for x in items}
          added = []
          for name in sorted(glob.glob('private/curated_candidates_*.json')):
              doc = json.loads(pathlib.Path(name).read_text(encoding='utf-8'))
              for row in doc.get('items', []):
                  wid = str(row.get('workId') or '')
                  sid = str(row.get('sourceIdentifier') or '')
                  if (wid and wid in seen_work) or (sid and sid in seen_source):
                      continue
                  items.append(row)
                  if wid: seen_work.add(wid)
                  if sid: seen_source.add(sid)
                  added.append({'workId': wid, 'sourceIdentifier': sid, 'title': row.get('titleOriginal')})
          if added:
              data['lastCuratedMergeCount'] = len(added)
              data['lastCuratedMergeItems'] = added
              primary.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'added': len(added), 'items': added}, ensure_ascii=False))
          PY

      - name: Commit merged acquisition queue
        run: |
          git config user.name 'prophet-ingestion-bot'
          git config user.email 'prophet-ingestion-bot@users.noreply.github.com'
          git add -- private/acquisition_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Merge 9 curated public-domain resources"
            git push
          fi
