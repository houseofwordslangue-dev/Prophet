name: Publish 500 additional Drive source articles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_500_drive_articles.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prophet-editorial-drive-500
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate exactly 500 extended Drive source articles
        run: python scripts/build_500_drive_articles.py
      - name: Commit generated publication batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- \
            data/editorial/drafts/2026-08-21/batch-21.json \
            data/editorial/drafts/2026-08-21/batch-22.json \
            data/editorial/drafts/2026-08-21/batch-23.json \
            data/editorial/drafts/2026-08-21/batch-24.json \
            data/editorial/drafts/2026-08-21/batch-25.json \
            data/editorial/drafts/2026-08-21/batch-26.json \
            data/editorial/drafts/2026-08-21/batch-27.json \
            data/editorial/drafts/2026-08-21/batch-28.json \
            data/editorial/drafts/2026-08-21/batch-29.json \
            data/editorial/drafts/2026-08-21/batch-30.json \
            data/editorial/publication_supplement.json \
            data/editorial/source_extract_500_drive_audit.json \
            assets/editorial-public.js \
            service-worker.js
          if git diff --cached --quiet; then
            echo 'No publication changes required.'
            exit 0
          fi
          git commit -m 'Publish 500 additional Drive source articles'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after refresh"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo 'Unable to publish after four serialized retries.' >&2
          exit 1
