name: Draft five life articles per remaining family member

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_remaining_family_life_5_each.py'
      - '.github/workflows/build-remaining-family-life-5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remaining-family-life-five
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebase source state
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Build and capture result
        id: build
        shell: bash
        run: |
          set +e
          python scripts/build_remaining_family_life_5_each.py > /tmp/family-build.log 2>&1
          code=$?
          cat /tmp/family-build.log
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,datetime,pathlib,os
          log=pathlib.Path('/tmp/family-build.log').read_text(errors='replace')
          code=int(os.environ.get('BUILD_CODE','0')) if os.environ.get('BUILD_CODE') else None
          pathlib.Path('data/editorial').mkdir(parents=True,exist_ok=True)
          # actual code is injected by shell after this block
          pathlib.Path('/tmp/logtail.json').write_text(json.dumps({'logTail':log[-12000:]},ensure_ascii=False),encoding='utf-8')
          PY
          python - "$code" <<'PY'
          import json,datetime,pathlib,sys
          code=int(sys.argv[1]); d=json.loads(pathlib.Path('/tmp/logtail.json').read_text())
          d.update({'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'status':'SUCCESS' if code==0 else 'FAILED','exitCode':code})
          pathlib.Path('data/editorial/remaining_family_life_5_run_status.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          exit 0
      - name: Validate draft gate
        if: steps.build.outputs.exitcode == '0'
        run: |
          python - <<'PY'
          import glob,json
          a=json.load(open('data/editorial/remaining_family_life_5_audit.json',encoding='utf-8'))
          assert a['draftsGenerated']==a['remainingMembersWithFiveDrafts']*5
          assert a['articlesAtOrBelow500Words']==0
          assert a['prophetOnlySectionsUsed']==0
          assert a['sourceCoveragePercent']==100 or a['draftsGenerated']==0
          assert a['aiOriginalSubstantiveContentPercent']==0
          rows=[]
          for f in sorted(glob.glob('data/editorial/drafts/2026-08-21/family-life-five-batch-*.json')):
              rows.extend(json.load(open(f,encoding='utf-8'))['drafts'])
          assert len(rows)==a['draftsGenerated']
          assert len({x['id'] for x in rows})==len(rows)
          assert len({x['bodyFingerprint'] for x in rows})==len(rows)
          assert all(x['publicationStatus']=='DRAFT' for x in rows)
          assert all(x['wordCount']>500 for x in rows)
          assert all(x['articleKind']=='life-article-not-research' for x in rows)
          assert all(x['sourceCoveragePercent']==100 and x['aiOriginalSubstantiveContentPercent']==0 for x in rows)
          print('PASS',a['remainingMembersWithFiveDrafts'],'members',a['draftsGenerated'],'drafts','gaps',a['sourceGapMembers'])
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- data/editorial/remaining_family_life_5_run_status.json
          if [ "${{ steps.build.outputs.exitcode }}" = "0" ]; then
            git add -- data/editorial/remaining_family_life_5_audit.json
            shopt -s nullglob
            files=(data/editorial/drafts/2026-08-21/family-life-five-batch-*.json)
            if ((${#files[@]})); then git add -- "${files[@]}"; fi
          fi
          if git diff --cached --quiet; then exit 0; fi
          if [ "${{ steps.build.outputs.exitcode }}" = "0" ]; then msg='Draft five life articles per remaining family member'; else msg='Record remaining family life draft failure'; fi
          git commit -m "$msg"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
      - name: Fail workflow if builder failed
        if: steps.build.outputs.exitcode != '0'
        run: exit 1
