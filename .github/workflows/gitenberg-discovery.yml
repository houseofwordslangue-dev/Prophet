name: GITenberg public-domain discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gitenberg-discovery.yml'
      - 'scripts/discover_gitenberg_resources.py'
  schedule:
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:
    inputs:
      resources:
        description: New resources to add per cycle
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: prophet-gitenberg-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PM_DISCOVERY_LIMIT: ${{ inputs.resources || '10' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find additional public-domain Islam and Prophet resources
        run: python scripts/discover_gitenberg_resources.py --limit "$PM_DISCOVERY_LIMIT"
      - name: Commit expanded acquisition queue
        run: |
          git config user.name 'prophet-ingestion-bot'
          git config user.email 'prophet-ingestion-bot@users.noreply.github.com'
          git add -- private/acquisition_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Discover 10 more verified GITenberg resources"
            git push
          fi
