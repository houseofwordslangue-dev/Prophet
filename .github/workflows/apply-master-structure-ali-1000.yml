name: Master structure and Ali 1000 source articles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_master_structure_and_ali_1000.py'
      - 'scripts/build_ali_1000_qdl.py'
      - '.github/workflows/apply-master-structure-ali-1000.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prophet-master-structure-ali-1000
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Arabic OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara
      - name: Record workflow run locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/editorial
          printf '{"runId":%s,"runAttempt":%s,"sha":"%s","startedAt":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > data/editorial/ali_1000_run.json
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- data/editorial/ali_1000_run.json
          git commit -m 'Record Ali 1000 workflow run' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Refresh after run locator
        run: git pull --rebase origin main
      - name: Build exactly 1000 Ali articles from QDL public-domain scan
        run: python scripts/build_ali_1000_qdl.py
      - name: Commit generated site structure and Ali publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- \
            assets/site-menu.css \
            assets/site-menu.js \
            data/site_sections.json \
            data/editorial/publication_supplement.json \
            data/editorial/ali_1000_audit.json \
            data/editorial/drafts/2026-08-21/ali-batch-*.json \
            ./*.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Publish 1000 Ali source articles and master menu'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
