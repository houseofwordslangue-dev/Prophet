# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
name: Master Governance

on:
  pull_request:
    paths:
      - 'MASTER-OVERRIDING-SITE-INSTRUCTION.md'
      - 'MASTER_OVERRIDING_INSTRUCTION.md'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'MASTER-OVERRIDING-SITE-INSTRUCTION.md'
      - 'MASTER_OVERRIDING_INSTRUCTION.md'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-master-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce controlling master instruction on new processes
        run: python3 scripts/check_master_governance.py
      - name: Audit unified current instructions
        run: python3 scripts/audit_current_instructions.py
