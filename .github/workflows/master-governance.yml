# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
name: Master Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce-master-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce controlling master instruction on new processes
        run: python3 scripts/check_master_governance.py
