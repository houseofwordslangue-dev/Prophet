name: Finalize remaining family life source gaps

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize_remaining_family_12_gaps.py'
      - '.github/workflows/finalize-remaining-family-12-gaps.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remaining-family-life-final-gaps
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Run curated classical gap finalizer
        id: build
        shell: bash
        run: |
          set +e
          python scripts/finalize_remaining_family_12_gaps.py > /tmp/final-family.log 2>&1
          code=$?
          cat /tmp/final-family.log
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          python - "$code" <<'PY'
          import json,datetime,pathlib,sys
          code=int(sys.argv[1]); log=pathlib.Path('/tmp/final-family.log').read_text(errors='replace')
          d={'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'status':'SUCCESS' if code==0 else 'FAILED','exitCode':code,'logTail':log[-12000:]}
          pathlib.Path('data/editorial/remaining_family_life_final_status.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          exit 0
      - name: Validate final family drafts
        if: steps.build.outputs.exitcode == '0'
        shell: bash
        run: |
          python - <<'PY'
          import glob,json
          a=json.load(open('data/editorial/remaining_family_life_5_audit.json',encoding='utf-8'))
          rows=[]
          for f in sorted(glob.glob('data/editorial/drafts/2026-08-21/family-life-five-batch-*.json')):
              rows += json.load(open(f,encoding='utf-8'))['drafts']
          assert len(rows)==a['draftsGenerated']
          assert a['draftsGenerated']==a['remainingMembersWithFiveDrafts']*5
          assert a['articlesAtOrBelow500Words']==0
          assert a['prophetOnlySectionsUsed']==0
          assert a['sourceCoveragePercent']==100
          assert a['aiOriginalSubstantiveContentPercent']==0
          assert len({x['id'] for x in rows})==len(rows)
          assert len({x['bodyFingerprint'] for x in rows})==len(rows)
          assert all(x['wordCount']>500 for x in rows)
          assert all(x['publicationStatus']=='DRAFT' and x['articleKind']=='life-article-not-research' for x in rows)
          print('PASS',a['remainingMembersWithFiveDrafts'],'members;',a['draftsGenerated'],'drafts;',a['sourceGapMembers'],'source gaps')
          PY
      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- data/editorial/remaining_family_life_final_status.json
          if [ "${{ steps.build.outputs.exitcode }}" = "0" ]; then
            git add -- data/editorial/remaining_family_life_5_audit.json
            shopt -s nullglob
            files=(data/editorial/drafts/2026-08-21/family-life-five-batch-*.json)
            if ((${#files[@]})); then git add -- "${files[@]}"; fi
          fi
          if git diff --cached --quiet; then exit 0; fi
          if [ "${{ steps.build.outputs.exitcode }}" = "0" ]; then msg='Finalize five life drafts for remaining family members'; else msg='Record final family source-gap failure'; fi
          git commit -m "$msg"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
      - name: Fail if finalizer failed
        if: steps.build.outputs.exitcode != '0'
        run: exit 1
