name: Public content source integrity

# Governed by MASTER_OVERRIDING_INSTRUCTION.md.
# Run only when public historical/editorial content or its provenance logic changes.
# This preserves hard source/provenance gates without generating failure emails for
# unrelated CSS, player, UI, or infrastructure commits.
on:
  pull_request:
    paths:
      - '*.html'
      - '*.json'
      - 'data/editorial/**'
      - 'data/children/**'
      - 'scripts/public_content_source_audit.py'
      - 'scripts/editorial_autopublish.py'
      - 'MASTER_OVERRIDING_INSTRUCTION.md'
      - '.github/workflows/public-content-source-audit.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.json'
      - 'data/editorial/**'
      - 'data/children/**'
      - 'scripts/public_content_source_audit.py'
      - 'scripts/editorial_autopublish.py'
      - 'MASTER_OVERRIDING_INSTRUCTION.md'
      - '.github/workflows/public-content-source-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public process language and provenance
        run: python scripts/public_content_source_audit.py
      - name: Verify editorial publication provenance
        run: python scripts/editorial_autopublish.py --check
