# GOVERNED_BY: MASTER_OVERRIDING_INSTRUCTION.md
name: Public content source integrity

# This workflow inventories legacy/public source-integrity gaps without turning
# known backlog into repeated failed-run emails. New source-derived publication
# still passes through editorial_autopublish.py, which remains the hard gate for
# provenance, quotations and unsupported factual content.
on:
  pull_request:
    paths:
      - '*.html'
      - '*.json'
      - 'data/editorial/**'
      - 'data/children/**'
      - 'scripts/public_content_source_audit.py'
      - 'scripts/editorial_autopublish.py'
      - 'MASTER_OVERRIDING_INSTRUCTION.md'
      - '.github/workflows/public-content-source-audit.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.json'
      - 'data/editorial/**'
      - 'data/children/**'
      - 'scripts/public_content_source_audit.py'
      - 'scripts/editorial_autopublish.py'
      - 'MASTER_OVERRIDING_INSTRUCTION.md'
      - '.github/workflows/public-content-source-audit.yml'
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public process language and provenance backlog
        id: publicaudit
        continue-on-error: true
        run: python scripts/public_content_source_audit.py
      - name: Verify current editorial publication candidates
        run: python scripts/editorial_autopublish.py --check
      - name: Summarize legacy/backlog findings without failing CI
        if: always()
        shell: bash
        run: |
          echo '### Public content source integrity' >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.publicaudit.outcome }}' = 'failure' ]; then
            echo 'Legacy/public audit findings remain queued for repair under the overriding master instruction.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Known backlog does not fail CI; newly published source-derived content remains strictly gated.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No legacy/public source-integrity findings detected.' >> "$GITHUB_STEP_SUMMARY"
          fi
