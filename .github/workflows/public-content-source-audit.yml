name: Public content source integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public process language and provenance
        run: python scripts/public_content_source_audit.py
      - name: Verify editorial publication provenance
        run: python scripts/editorial_autopublish.py --check
