name: Publish Ali life biographies 1000

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_ali_life_biographies_1000.py'
      - '.github/workflows/publish-ali-life-biographies-1000.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ali-life-biographies-1000
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Arabic OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara
      - name: Build exactly 1000 Ali life biographies over 500 words
        run: python scripts/build_ali_life_biographies_1000.py
      - name: Commit biography corpus and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- data/editorial/publication_supplement.json data/editorial/ali_life_biographies_1000_audit.json data/editorial/drafts/2026-08-21/ali-life-bio-batch-*.json
          git commit -m 'Publish 1000 long-form Ali life biographies' || exit 0
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
# trigger: 2026-08-21T06:12+01:00
