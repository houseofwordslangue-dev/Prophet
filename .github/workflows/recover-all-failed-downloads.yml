name: Recover all failed downloads

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/recover_all_public_assets.py'
      - 'data/catalogue/**'
      - 'data/recovery/direct_downloads.json'
      - '.github/workflows/recover-all-failed-downloads.yml'

permissions:
  contents: write

concurrency:
  group: recover-all-failed-downloads
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RECOVERY_MAX_FILE_BYTES: '99614720'
      RECOVERY_MAX_TOTAL_BYTES: '943718400'
      RECOVERY_MAX_DOWNLOADS: '2000'
      RECOVERY_HTTP_TIMEOUT: '45'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and download rights-cleared public resources
        run: python scripts/recover_all_public_assets.py
      - name: Commit recovered resources in bounded batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-library-bot'
          git config user.email 'actions@users.noreply.github.com'

          git add -- data/recovery/all_recovery_queue.json data/recovery/all_recovery_report.json data/ingested_library.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update full failed-download recovery state'
          fi

          mapfile -t files < <(git ls-files --others --modified --exclude-standard library/works | sort)
          batch=()
          n=0
          for f in "${files[@]}"; do
            batch+=("$f")
            n=$((n+1))
            if [ "$n" -ge 40 ]; then
              git add -- "${batch[@]}"
              git commit -m 'Recover rights-cleared library assets (batch)' || true
              batch=()
              n=0
            fi
          done
          if [ "${#batch[@]}" -gt 0 ]; then
            git add -- "${batch[@]}"
            git commit -m 'Recover rights-cleared library assets (batch)' || true
          fi

          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo 'No recovery changes to push.'
          fi
