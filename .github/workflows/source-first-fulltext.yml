name: Source-first full-text enablement
on:
  push:
    branches: [main]
    paths:
      - 'data/public_catalog_all.generated.json'
      - 'data/source_first_fulltext_policy.json'
      - 'data/drive_native_assets_20260822.json'
      - 'private/acquisition_candidates.json'
      - 'scripts/source_first_fulltext_resolver.py'
      - 'scripts/discover_native_open_sources.py'
      - 'scripts/acquire_unrestricted_library.py'
      - 'scripts/promote_verified_catalogue_candidates.py'
      - 'scripts/reconcile_fulltext_catalog.py'
      - '.github/workflows/source-first-fulltext.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prophet-source-first-fulltext
  cancel-in-progress: false
jobs:
  resolve-and-acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search known EPUB text Word and other native formats before OCR
        run: python scripts/source_first_fulltext_resolver.py
      - name: Deep-search open native editions before OCR
        continue-on-error: true
        run: python scripts/discover_native_open_sources.py --limit 80
      - name: Promote verified native sources with EPUB text Word priority
        continue-on-error: true
        run: python scripts/promote_verified_catalogue_candidates.py --limit 150
      - name: Acquire verified unrestricted native copies
        run: python scripts/acquire_unrestricted_library.py --limit 40
      - name: Rebuild public reader index
        run: python scripts/build_ingested_library.py
      - name: Enable full text for newly acquired resources
        run: python scripts/reconcile_fulltext_catalog.py
      - name: Re-run publication audit
        continue-on-error: true
        run: python scripts/exhaustive_publication_audit.py
      - name: Commit resolver state and updated catalogue
        run: |
          git config user.name 'prophet-source-first-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- private/source_first_resolution.json private/native_discovery_state.json private/acquisition_candidates.json private/acquisition_state.json data/ingested_library.json data/public_catalog_all.generated.json data/audits/exhaustive-publication-audit-current.json data/audits/exhaustive-publication-audit.generated.json data/audits/exhaustive-publication-audit.generated.md || true
          if ! git diff --cached --quiet; then
            git commit -m 'Enable newly verified source-first full text'
            git push
          fi
      - name: Deploy acquired full-text assets to production
        env:
          PM_DEPLOY_HOST: ${{ secrets.PM_DEPLOY_HOST }}
          PM_DEPLOY_USER: ${{ secrets.PM_DEPLOY_USER }}
          PM_DEPLOY_PATH: ${{ secrets.PM_DEPLOY_PATH }}
          PM_DEPLOY_SSH_KEY: ${{ secrets.PM_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$PM_DEPLOY_HOST" ] || [ -z "$PM_DEPLOY_USER" ] || [ -z "$PM_DEPLOY_PATH" ] || [ -z "$PM_DEPLOY_SSH_KEY" ]; then
            echo 'Deployment secrets not configured; acquisition/index state committed but binary deployment skipped.'
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PM_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PM_DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$PM_DEPLOY_USER@$PM_DEPLOY_HOST" "mkdir -p '$PM_DEPLOY_PATH/data' '$PM_DEPLOY_PATH/library/works'"
          rsync -az data/ingested_library.json data/public_catalog_all.generated.json data/audits/exhaustive-publication-audit-current.json "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/data/"
          if [ -d library/works ]; then
            rsync -az library/works/ "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/library/works/"
          fi
