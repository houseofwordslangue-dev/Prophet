name: Ingest retained batch 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/recovery/retained_batch_2.json'
      - 'scripts/ingest_retained_batch.py'
      - '.github/workflows/ingest-retained-batch-2.yml'

permissions:
  contents: write

concurrency:
  group: prophet-retained-batch-2
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RECOVERY_MAX_FILE_BYTES: '99614720'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download retained sources
        run: python scripts/ingest_retained_batch.py
      - name: Commit real ingested assets and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-library-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/ingested_library.json data/recovery/retained_batch_2_report.json library/works/quran-meaning-063 library/works/hadith-commentary-003 library/works/life-seerah-049 library/works/quran-meaning-017 library/works/quran-meaning-069 library/works/family-companions-006 library/works/life-seerah-013 library/works/family-companions-004 library/works/character-shamail-005 library/works/quran-meaning-015 library/works/quran-meaning-013 library/works/family-companions-009 library/works/quran-meaning-003 library/works/quran-meaning-001 || true
          if git diff --cached --quiet; then
            echo 'No new assets to commit.'
            exit 0
          fi
          git commit -m 'Ingest retained source books batch 2'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
