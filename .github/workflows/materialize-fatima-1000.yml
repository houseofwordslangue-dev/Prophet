name: Materialize 1000 Fatima source articles

on:
  push:
    branches: [main]
    paths:
      - 'data/editorial/fatima_source_fragments.json.gz.b64'
      - 'scripts/materialize_fatima_1000_compiled.py'
      - '.github/workflows/materialize-fatima-1000.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-fatima-1000
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 1000 Fatima articles
        run: python scripts/materialize_fatima_1000_compiled.py
      - name: Validate publication gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json
          audit=json.load(open('data/editorial/fatima_1000_audit.json',encoding='utf-8'))
          assert audit['complete'] is True and audit['extracted']==1000
          assert audit['allAtLeast500Words'] is True and audit['minimumObservedWords']>=500
          assert audit['uniqueArticleBodies']==1000 and audit['sourceFragmentCount']>=300
          assert audit['sourceCoveragePercent']==100 and audit['aiOriginalSubstantiveContentPercent']==0
          assert audit['identityFiltering']['status']=='PASS' and audit['noSyntheticBodyText'] is True
          files=sorted(glob.glob('data/editorial/drafts/2026-08-21/fatima-long-batch-*.json'))
          assert len(files)==20
          rows=[]
          for f in files: rows.extend(json.load(open(f,encoding='utf-8'))['drafts'])
          assert len(rows)==1000 and len({x['id'] for x in rows})==1000
          assert len({x['bodyFingerprint'] for x in rows})==1000
          assert all(x['wordCount']>=500 for x in rows)
          assert all(x['sourceCoveragePercent']==100 and x['aiOriginalSubstantiveContentPercent']==0 for x in rows)
          supplement=json.load(open('data/editorial/publication_supplement.json',encoding='utf-8'))
          ids=set(supplement['publishedIds'])
          assert all(x['id'] in ids for x in rows)
          assert supplement['fatima1000']['count']==1000
          print('PASS: 1000 Fatima articles published, >=500 words, source-only')
          PY
      - name: Commit materialized publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- data/editorial/fatima_1000_audit.json data/editorial/publication_supplement.json data/editorial/drafts/2026-08-21/fatima-long-batch-*.json
          if git diff --cached --quiet; then echo 'No generated publication changes.'; exit 0; fi
          git commit -m 'Publish 1000 longform Fatima source articles'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
