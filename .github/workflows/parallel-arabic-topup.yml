name: Parallel Arabic top-up

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ingest_parallel_arabic_topup.py'
      - '.github/workflows/parallel-arabic-topup.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PARALLEL_TOPUP_TARGET: '49'
      PARALLEL_TOPUP_MAX_FILE_BYTES: '99614720'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start from latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Resolve and download Arabic catalogue candidates in parallel
        run: python scripts/ingest_parallel_arabic_topup.py
      - name: Publish through isolated recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-library-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/ingested_library.json data/recovery/parallel_arabic_topup_report.json library/works
          if git diff --cached --quiet; then
            echo 'No recovery changes.'
            exit 0
          fi
          git commit -m 'Ingest parallel Arabic recovery top-up'
          OUT="bot/parallel-arabic-topup-${GITHUB_RUN_ID}"
          git push origin HEAD:"$OUT"
          PR_URL=$(gh pr create --base main --head "$OUT" --title 'Ingest parallel Arabic recovery top-up' --body 'Automated parallel recovery output toward the remaining 49-book target. Only successfully downloaded/indexed assets are included.')
          gh pr merge "$PR_URL" --squash --delete-branch
