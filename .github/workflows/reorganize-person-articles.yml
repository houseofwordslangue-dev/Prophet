name: Reorganize person articles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reorganize_person_articles.py'
      - '.github/workflows/reorganize-person-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reorganize-person-articles
  cancel-in-progress: false

jobs:
  reorganize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reorganize canonical person publications
        run: python scripts/reorganize_person_articles.py
      - name: Validate organization
        run: |
          python - <<'PY'
          import glob,json
          idx=json.load(open('data/editorial/person_article_index.json',encoding='utf-8'))
          p=idx['people']['khadija-bint-khuwaylid']
          assert p['canonicalBiographyCount']==1
          assert p['supportingArticleCount']==1000
          assert sum(p['sectionCounts'].values())==1000
          rows=[]
          for f in glob.glob('data/editorial/drafts/2026-08-21/khadija-long-batch-*.json'):
              rows.extend(json.load(open(f,encoding='utf-8'))['drafts'])
          assert len(rows)==1000
          assert all(x['articleRole']=='supporting-research' for x in rows)
          assert all(x['canonicalBiography'] is False for x in rows)
          assert all(len(x['sections'])==1 for x in rows)
          assert all(x['relatedPerson']['key']=='khadija-bint-khuwaylid' for x in rows)
          assert not any('family/khadija' in x['sections'] for x in rows)
          print('PASS: one canonical Khadija biography; 1000 supporting articles placed by theme')
          PY
      - name: Commit reorganized publication data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- data/editorial/person_article_index.json data/editorial/khadija_1000_audit.json data/editorial/publication_supplement.json data/editorial/drafts/2026-08-21/khadija-long-batch-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reorganize Khadija articles under canonical person page'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
