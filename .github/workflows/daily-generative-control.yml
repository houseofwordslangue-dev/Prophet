name: Daily Prophet generation control

# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
# Single consolidated generative cycle. Governance, security, restoration,
# integrity and acceptance workflows remain enabled and are never cancelled here.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-generative-control.yml'
      - 'MASTER-OVERRIDING-SITE-INSTRUCTION.md'
      - 'scripts/source_first_fulltext_resolver.py'
      - 'scripts/check_resource_extraction_availability.py'
      - 'data/drive_native_assets_20260822.json'
      - 'data/public_catalog_all.generated.json'

permissions:
  contents: write
  issues: write

concurrency:
  group: prophet-single-daily-generation
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_ISSUE: '94'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce controlling master before generation
        run: |
          python scripts/audit_current_instructions.py
          python scripts/check_master_governance.py

      - name: Run one consolidated daily generative cycle
        shell: bash
        run: |
          set +e
          : > /tmp/prophet-daily.log
          run_one() {
            label="$1"; shift
            echo "===== $label =====" | tee -a /tmp/prophet-daily.log
            "$@" >>/tmp/prophet-daily.log 2>&1
            rc=$?
            echo "RESULT $label = $rc" | tee -a /tmp/prophet-daily.log
            return 0
          }

          # RESOURCE AVAILABILITY: every catalogue resource must resolve to an extraction path.
          # Resolution priority: local/ingested -> Drive EPUB/text -> verified remote native text -> PDF+OCR.
          for pass in 1 2 3; do
            [ -f scripts/source_first_fulltext_resolver.py ] && run_one "resource extraction resolver pass $pass" python scripts/source_first_fulltext_resolver.py
            [ -f scripts/live_native_catalog_resolver.py ] && run_one "live native catalog resolver pass $pass" python scripts/live_native_catalog_resolver.py
            [ -f scripts/acquire_unrestricted_library.py ] && run_one "library acquisition pass $pass" python scripts/acquire_unrestricted_library.py --limit 500
            [ -f scripts/build_ingested_library.py ] && run_one "library index rebuild pass $pass" python scripts/build_ingested_library.py
          done
          [ -f scripts/source_first_fulltext_resolver.py ] && run_one 'resource extraction resolver final' python scripts/source_first_fulltext_resolver.py
          [ -f scripts/check_resource_extraction_availability.py ] && run_one 'strict resource extraction availability gate' python scripts/check_resource_extraction_availability.py

          # Editorial generation may consume ONLY resource records marked extractionReady=true.
          if [ -f scripts/daily_rotating_editorial_fill.py ]; then
            for section in light prophet messenger human mercy family companions media; do
              run_one "editorial-$section" python scripts/daily_rotating_editorial_fill.py --section "$section"
            done
          fi

          [ -f scripts/content_completion_status.py ] && run_one 'content completion status' python scripts/content_completion_status.py
          [ -f scripts/completion_slot_fill.py ] && run_one 'underfilled slot completion' python scripts/completion_slot_fill.py

          # Biography enrichment = extraction + source-grounded synthesis/assembly.
          # Catalog-only resources without extractionReady=true are never eligible evidence.
          [ -f scripts/mine_all_missing_biography_sources.py ] && run_one 'biography source mining' python scripts/mine_all_missing_biography_sources.py
          [ -f scripts/extend_short_biographies_500.py ] && run_one 'strict local short-biography extraction' python scripts/extend_short_biographies_500.py
          [ -f scripts/enrich_short_biographies_siyar_direct.py ] && run_one 'direct Siyar biography extraction' python scripts/enrich_short_biographies_siyar_direct.py
          [ -f scripts/enrich_short_biographies_wikisource.py ] && run_one 'classical biography extraction and source-grounded assembly' python scripts/enrich_short_biographies_wikisource.py
          [ -f scripts/complete_required_biographies.py ] && run_one 'biography canonical registry refresh' python scripts/complete_required_biographies.py

          [ -f scripts/editorial_autopublish.py ] && run_one 'editorial provenance check' python scripts/editorial_autopublish.py --check
          [ -f scripts/editorial_autopublish.py ] && run_one 'editorial autopublish' python scripts/editorial_autopublish.py

          echo 'Daily consolidated cycle complete.' | tee -a /tmp/prophet-daily.log

      - name: Commit valid generated state once
        shell: bash
        run: |
          set +e
          git config user.name 'prophet-daily-bot'
          git config user.email 'prophet-daily-bot@users.noreply.github.com'
          git add -A data/editorial data/children data/ingested_library.json data/public_catalog_all.generated.json private/acquisition_candidates.json private/acquisition_state.json private/source_first_resolution.json private/resource_extraction_queue.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Daily consolidated generation and publication [skip ci]' || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
          exit 0

      - name: Post at most one daily generation notification
        shell: bash
        run: |
          set +e
          day="$(date -u +%F)"
          marker="<!-- prophet-daily-report:$day -->"
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$REPORT_ISSUE/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -Fq "$marker"; then
            echo 'Daily report already posted; suppressing duplicate notification.'
            exit 0
          fi

          successes=$(grep -c 'RESULT .* = 0' /tmp/prophet-daily.log 2>/dev/null || true)
          recoverable=$(grep -c 'RESULT .* = [1-9]' /tmp/prophet-daily.log 2>/dev/null || true)
          tailtext=$(tail -n 30 /tmp/prophet-daily.log 2>/dev/null | sed 's/`/'"'"'/g')
          cat > /tmp/report.md <<EOF
          $marker
          ## Daily Prophet generation report — $day

          - Successful pipeline stages: $successes
          - Recoverable/non-zero stages: $recoverable
          - Resource policy: generation uses only verified extractionReady resources.
          - Resolver/acquisition runs three passes per cycle, followed by a strict final availability audit.
          - Missing resources remain in acquisition/retry until an extraction path exists; they are never silently treated as usable.
          - Biography mode: extract first, then source-grounded synthesis/assembly; no unsupported historical fill.
          - Governance/security/acceptance workflows remain enabled.
          - Notification policy: one report per UTC day.
          - Master rule: source truth and provenance override quotas.

          <details><summary>Last runtime lines</summary>

          \`\`\`
          $tailtext
          \`\`\`
          </details>
          EOF
          gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md >/dev/null 2>&1 || true
          exit 0

# Resource extraction availability hardening: 2026-08-22
