name: Daily Prophet generation control
# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
# Only automatic workflow; one scheduled run per UTC day.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: prophet-single-daily-generation
  cancel-in-progress: true
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_ISSUE: '94'
      PM_DEPLOY_HOST: ${{ secrets.PM_DEPLOY_HOST }}
      PM_DEPLOY_USER: ${{ secrets.PM_DEPLOY_USER }}
      PM_DEPLOY_PATH: ${{ secrets.PM_DEPLOY_PATH }}
      PM_DEPLOY_SSH_KEY: ${{ secrets.PM_DEPLOY_SSH_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Consolidated generation, repair and audit cycle
        shell: bash
        run: |
          set +e
          : > /tmp/prophet-daily.log
          rm -f /tmp/prophet-publication-blocked
          run_one(){ label="$1"; shift; echo "===== $label =====" | tee -a /tmp/prophet-daily.log; "$@" >>/tmp/prophet-daily.log 2>&1; rc=$?; echo "RESULT $label = $rc" | tee -a /tmp/prophet-daily.log; return 0; }
          hard_gate(){ label="$1"; shift; echo "===== $label =====" | tee -a /tmp/prophet-daily.log; "$@" >>/tmp/prophet-daily.log 2>&1; rc=$?; echo "RESULT $label = $rc" | tee -a /tmp/prophet-daily.log; [ "$rc" -ne 0 ] && touch /tmp/prophet-publication-blocked; return 0; }

          # Governance / safe repair
          [ -f scripts/system_gap_audit_and_repair.py ] && run_one 'system gap audit before cycle' python scripts/system_gap_audit_and_repair.py --repair
          [ -f scripts/audit_current_instructions.py ] && run_one 'instruction audit' python scripts/audit_current_instructions.py
          [ -f scripts/check_master_governance.py ] && run_one 'master governance' python scripts/check_master_governance.py

          # Source-first recovery. OCR-derived text remains explicitly OCR-derived.
          for pass in 1 2 3 4; do
            [ -f scripts/source_first_fulltext_resolver.py ] && run_one "resource resolver pass $pass" python scripts/source_first_fulltext_resolver.py
            [ -f scripts/live_native_catalog_resolver.py ] && run_one "live native catalog pass $pass" python scripts/live_native_catalog_resolver.py
            [ -f scripts/acquire_unrestricted_library.py ] && run_one "library acquisition pass $pass" python scripts/acquire_unrestricted_library.py --limit 200
            [ -f scripts/build_ingested_library.py ] && run_one "library index rebuild pass $pass" python scripts/build_ingested_library.py
          done
          [ -f scripts/force_complete_resource_extraction.py ] && run_one 'force complete verified extraction routes' python scripts/force_complete_resource_extraction.py
          [ -f scripts/source_first_fulltext_resolver.py ] && run_one 'resource resolver final' python scripts/source_first_fulltext_resolver.py
          [ -f scripts/enforce_resource_extraction_readiness.py ] && run_one 'resource extraction backlog audit' python scripts/enforce_resource_extraction_readiness.py

          # Editorial rotation / underfilled slots
          if [ -f scripts/daily_rotating_editorial_fill.py ]; then
            for section in light prophet messenger human mercy family companions media; do run_one "editorial-$section" python scripts/daily_rotating_editorial_fill.py --section "$section"; done
          fi
          [ -f scripts/daily_completion_batch.py ] && run_one 'all underfilled editorial slots' python scripts/daily_completion_batch.py

          # Biographies
          [ -f scripts/mine_all_missing_biography_sources.py ] && run_one 'biography source mining' python scripts/mine_all_missing_biography_sources.py
          [ -f scripts/extend_short_biographies_500.py ] && run_one 'short biography source extraction' python scripts/extend_short_biographies_500.py
          [ -f scripts/enrich_short_biographies_siyar_direct.py ] && run_one 'Siyar biography extraction' python scripts/enrich_short_biographies_siyar_direct.py
          [ -f scripts/enrich_short_biographies_wikisource.py ] && run_one 'classical biography extraction' python scripts/enrich_short_biographies_wikisource.py
          [ -f scripts/complete_required_biographies.py ] && run_one 'canonical biography registry' python scripts/complete_required_biographies.py
          [ -f scripts/biography_coverage_status.py ] && run_one 'biography coverage status' python scripts/biography_coverage_status.py

          # Children / media
          [ -f scripts/children_completion_status.py ] && run_one 'children completion status' python scripts/children_completion_status.py
          [ -f scripts/animated_children_pipeline.py ] && run_one 'animated children integrity' python scripts/animated_children_pipeline.py --validate-only
          if [ -n "${OPENAI_API_KEY:-}" ] && [ -f scripts/generate_children_artwork.py ]; then run_one 'children artwork repair/generation' python scripts/generate_children_artwork.py; else echo 'RESULT children artwork = SKIPPED_NO_CREDENTIAL_OR_SCRIPT' | tee -a /tmp/prophet-daily.log; fi

          # Hard publication gates. Failure blocks autopublish and live deploy.
          [ -f scripts/professional_release_gate.py ] && hard_gate 'professional release gate' python scripts/professional_release_gate.py
          [ -f scripts/editorial_autopublish.py ] && hard_gate 'editorial provenance gate' python scripts/editorial_autopublish.py --check
          if [ ! -e /tmp/prophet-publication-blocked ] && [ -f scripts/editorial_autopublish.py ]; then run_one 'editorial autopublish' python scripts/editorial_autopublish.py; else echo 'PUBLICATION_BLOCKED_BY_HARD_GATE' | tee -a /tmp/prophet-daily.log; fi

          # Final machine-readable ledgers
          [ -f scripts/system_gap_audit_and_repair.py ] && run_one 'system gap audit after cycle' python scripts/system_gap_audit_and_repair.py --repair
          [ -f scripts/source_first_fulltext_resolver.py ] && run_one 'resource resolver post-generation' python scripts/source_first_fulltext_resolver.py
          [ -f scripts/enforce_resource_extraction_readiness.py ] && run_one 'resource extraction final backlog audit' python scripts/enforce_resource_extraction_readiness.py
          [ -f scripts/children_completion_status.py ] && run_one 'children final status' python scripts/children_completion_status.py
          [ -f scripts/content_completion_status.py ] && run_one 'content final status' python scripts/content_completion_status.py
          [ -f scripts/biography_coverage_status.py ] && run_one 'biography final status' python scripts/biography_coverage_status.py
          [ -e /tmp/prophet-publication-blocked ] && echo 'PUBLICATION_GATE_STATUS=BLOCKED' >>/tmp/prophet-daily.log || echo 'PUBLICATION_GATE_STATUS=PASS' >>/tmp/prophet-daily.log
      - name: Commit valid generated state once
        shell: bash
        run: |
          set +e
          git config user.name 'prophet-daily-bot'; git config user.email 'prophet-daily-bot@users.noreply.github.com'
          git add -A data scripts docs AUTO_*.md library 2>/dev/null || true
          git add -f private/acquisition_candidates.json private/acquisition_state.json private/source_first_resolution.json private/resource_extraction_queue.json private/native_source_overrides.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'Daily consolidated generation, repair and publication [skip ci]' || true; git pull --rebase origin main || true; git push origin HEAD:main || true; fi
          exit 0
      - name: Build and optionally deploy public bundle
        shell: bash
        run: |
          set +e
          if [ -e /tmp/prophet-publication-blocked ]; then echo 'LIVE_DEPLOY_BLOCKED_BY_HARD_GATE' | tee -a /tmp/prophet-daily.log; exit 0; fi
          rm -rf publish-bundle; mkdir -p publish-bundle/data publish-bundle/library
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.xml' -o -name '*.webmanifest' -o -name 'robots.txt' -o -name 'sitemap*.xml' \) -exec cp -p '{}' publish-bundle/ \;
          [ -d assets ] && rsync -a assets/ publish-bundle/assets/
          find data -maxdepth 1 -type f -name '*.json' -exec cp -p '{}' publish-bundle/data/ \;
          [ -d data/editorial ] && { mkdir -p publish-bundle/data/editorial; rsync -a --exclude 'audits/' --exclude '*-audit.json' --exclude '*_audit.json' data/editorial/ publish-bundle/data/editorial/; }
          [ -d data/children ] && { mkdir -p publish-bundle/data/children; rsync -a data/children/ publish-bundle/data/children/; }
          [ -d data/catalogue ] && { mkdir -p publish-bundle/data/catalogue; rsync -a data/catalogue/ publish-bundle/data/catalogue/; }
          [ -d library/works ] && { mkdir -p publish-bundle/library/works; rsync -a library/works/ publish-bundle/library/works/; }
          rm -rf publish-bundle/private
          if [ -z "${PM_DEPLOY_HOST:-}" ] || [ -z "${PM_DEPLOY_USER:-}" ] || [ -z "${PM_DEPLOY_PATH:-}" ] || [ -z "${PM_DEPLOY_SSH_KEY:-}" ]; then echo 'DEPLOYMENT_NOT_CONFIGURED' | tee -a /tmp/prophet-daily.log; exit 0; fi
          install -d -m 700 ~/.ssh; printf '%s\n' "$PM_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; ssh-keyscan -H "$PM_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "$PM_DEPLOY_USER@$PM_DEPLOY_HOST" "mkdir -p '$PM_DEPLOY_PATH'" || { echo 'DEPLOY_RETRYABLE: ssh unavailable' | tee -a /tmp/prophet-daily.log; exit 0; }
          rsync -az --checksum publish-bundle/ "$PM_DEPLOY_USER@$PM_DEPLOY_HOST:$PM_DEPLOY_PATH/" || { echo 'DEPLOY_RETRYABLE: rsync failed' | tee -a /tmp/prophet-daily.log; exit 0; }
          echo 'LIVE_DEPLOY_COMPLETE' | tee -a /tmp/prophet-daily.log
      - name: Post at most one daily generation notification
        shell: bash
        run: |
          set +e
          day="$(date -u +%F)"; marker="<!-- prophet-daily-report:$day -->"
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$REPORT_ISSUE/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -Fq "$marker"; then exit 0; fi
          successes=$(grep -c 'RESULT .* = 0' /tmp/prophet-daily.log 2>/dev/null || true); recoverable=$(grep -Ec 'RESULT .* = [1-9]|NEEDS_SOURCE|RETRYABLE|DEPLOYMENT_NOT_CONFIGURED' /tmp/prophet-daily.log 2>/dev/null || true); gate=$(grep 'PUBLICATION_GATE_STATUS=' /tmp/prophet-daily.log | tail -1 || true); tailtext=$(tail -n 50 /tmp/prophet-daily.log | sed 's/`/'"'"'/g')
          cat >/tmp/report.md <<EOF
          $marker
          ## Daily Prophet generation report — $day
          - Successful stages: $successes
          - Recoverable/backlog signals: $recoverable
          - Automatic workflow count: **1**
          - $gate
          - Governing master: MASTER-OVERRIDING-SITE-INSTRUCTION.md
          - Source truth, provenance, rights, and integrity override numerical targets.
          <details><summary>Last runtime lines</summary>

          \`\`\`
          $tailtext
          \`\`\`
          </details>
          EOF
          gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md >/dev/null 2>&1 || true
