name: Generate and validate 100 animated children stories

on:
  pull_request:
    paths:
      - 'scripts/generate_animated_children_stories.py'
      - 'scripts/animated_children_quality_revision.py'
      - 'scripts/animated_children_story_writer.py'
      - 'scripts/animated_children_source_inspiration.py'
      - 'scripts/animated_children_pipeline.py'
      - 'data/children/animated/schema.json'
      - 'children-animated.html'
      - 'children.html'
      - 'children-stories.html'
      - 'assets/children-animated.css'
      - 'assets/children-animated.js'
      - '.github/workflows/generate-animated-children-stories.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_animated_children_stories.py'
      - 'scripts/animated_children_quality_revision.py'
      - 'scripts/animated_children_story_writer.py'
      - 'scripts/animated_children_source_inspiration.py'
      - 'scripts/animated_children_pipeline.py'
      - 'data/children/animated/schema.json'
      - 'children-animated.html'
      - 'assets/children-animated.css'
      - 'assets/children-animated.js'
      - '.github/workflows/generate-animated-children-stories.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animated-children-100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'animated-children-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate five-batch source-inspired revised corpus and missing artwork
        run: python scripts/animated_children_pipeline.py
      - name: Run strict editorial and corpus audit
        run: python scripts/animated_children_pipeline.py --validate-only
      - name: Validate distribution, schema, routes and player contract
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('data/children/animated')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          idx=json.loads((root/'index.json').read_text(encoding='utf-8'))
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          schema=json.loads((root/'schema.json').read_text(encoding='utf-8'))
          assert schema['$id']=='children-animated-story-v1'
          assert m['count']==100
          assert m['ageGroups']=={'5-7':25,'8-10':25,'11-13':25,'14-16':25}
          assert all(v==10 for v in m['categories'].values()) and len(m['categories'])==10
          assert len(m['batches'])==5 and all(len(v)==20 for v in m['batches'].values())
          assert len(idx['items'])==100
          assert len({x['id'] for x in idx['items']})==100
          assert len({x['slug'] for x in idx['items']})==100
          assert len({x['titleAr'] for x in idx['items']})==100
          assert len({x['titleEn'] for x in idx['items']})==100
          assert len({x['titleFr'] for x in idx['items']})==100
          assert status['ready']==100 and status['failed']==0 and status['animatedStoryboard']==100
          assert status['nativeVideo']==0 and status['ttsFallback']==100
          motifs=set()
          for x in idx['items']:
              p=pathlib.Path(x['path']); assert p.is_file(),p
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['publicationStatus']=='READY'
              assert d['watchMode']=='animated-storyboard'
              assert d['listenMode']=='browser-tts'
              assert d['fictional'] is True and d['historicalClaim'] is False
              assert len(d['scenes'])==10
              insp=d['inspirationBasis']
              assert insp['type']=='resource-derived-motif'
              assert insp['historicalRetelling'] is False and insp['quotation'] is False and insp['namedHistoricalFigures'] is False
              motifs.add(insp['eventPattern'])
              assert not re.search(r'[\u0600-\u06ff]', d['synopsisFr']+' '+d['moralFr']+' '+' '.join(s['text'] for s in d['storyFr']))
              for lang in ('storyAr','storyEn','storyFr'):
                  for scene in d[lang]:
                      ss=[z.strip() for z in re.split(r'(?<=[.!؟?])\s+',scene['text']) if z.strip()]
                      assert len(set(ss))/max(1,len(ss)) >= .92,(d['id'],lang,scene['sceneNumber'])
              assert pathlib.Path(d['cover']['path']).is_file()
              assert all(pathlib.Path(s['illustration']).is_file() for s in d['scenes'])
          assert len(motifs)==10,motifs
          html=pathlib.Path('children-animated.html').read_text(encoding='utf-8')
          js=pathlib.Path('assets/children-animated.js').read_text(encoding='utf-8')
          for required in ['caPlay','caPrev','caNext','caTimeline','caNarration','caSubtitleToggle','caReadToggle','caListen','caFullscreen','caReplay','caSpeed','caPlayerLanguage','caSceneSelect']:
              assert required in html,required
          assert 'speechSynthesis' in js
          assert 'children-animated.html' in pathlib.Path('children.html').read_text(encoding='utf-8')
          assert 'children-stories.html' in pathlib.Path('children.html').read_text(encoding='utf-8')
          print('PASS: source-inspired editorial/schema/frontend/player/publication contract')
          PY
      - name: Materialize generated corpus on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'animated-children-bot'
          git config user.email 'animated-children-bot@users.noreply.github.com'
          git add -- data/children/animated assets/children-animated/covers assets/children-animated/scenes
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize source-inspired animated children stories'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
