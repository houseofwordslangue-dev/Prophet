name: Children content artwork generation

on:
  workflow_dispatch:
    inputs:
      replace_all:
        description: Replace existing children artwork
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - 'data/children/**'
      - 'content/children/**'
      - 'public/data/children/**'
      - 'scripts/generate_children_artwork.py'
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: children-artwork
  cancel-in-progress: false

jobs:
  generate-and-replace-artwork:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IMAGE_MODEL: gpt-image-2
      CHILDREN_IMAGE_SIZE: 1536x1024
      CHILDREN_IMAGE_QUALITY: medium
      CHILDREN_IMAGE_RETRIES: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require image generation credential
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY repository secret is required for automatic children artwork generation.' >&2
            exit 1
          fi

      - name: Replace all children story and article artwork
        run: python scripts/generate_children_artwork.py

      - name: Verify generated artwork exists
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=[Path('data/children'),Path('content/children'),Path('public/data/children')]
          pngs=[]
          for r in roots:
              if r.exists():
                  pngs += list(r.rglob('*.png'))
          pngs += list(Path('public/images/children').rglob('*.png')) if Path('public/images/children').exists() else []
          if not pngs:
              raise SystemExit('No generated children PNG artwork found')
          print(f'PASS generated/replacement PNG files={len(set(pngs))}')
          PY

      - name: Commit replacement artwork and content references
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No children artwork changes to commit.'
            exit 0
          fi
          git config user.name 'prophet-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/children content/children public/data/children public/images/children 2>/dev/null || true
          git commit -m 'Auto-replace children stories and articles artwork'
          git push
