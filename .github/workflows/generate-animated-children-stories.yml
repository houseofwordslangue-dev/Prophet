name: Generate and validate 600 animated children stories

on:
  pull_request:
    paths:
      - 'scripts/generate_animated_children_stories.py'
      - 'scripts/animated_children_quality_revision.py'
      - 'scripts/animated_children_story_writer.py'
      - 'scripts/animated_children_story_diversifier.py'
      - 'scripts/animated_children_subplots.py'
      - 'scripts/animated_children_targeted_distinctions.py'
      - 'scripts/animated_children_french_polish.py'
      - 'scripts/animated_children_source_inspiration.py'
      - 'scripts/animated_children_expansion.py'
      - 'scripts/animated_children_metadata_localization.py'
      - 'scripts/animated_children_final_localization.py'
      - 'scripts/animated_children_pipeline.py'
      - 'data/children/animated/schema.json'
      - 'children-animated.html'
      - 'children.html'
      - 'children-stories.html'
      - 'assets/children-animated.css'
      - 'assets/children-animated.js'
      - 'service-worker.js'
      - '.github/workflows/generate-animated-children-stories.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_animated_children_stories.py'
      - 'scripts/animated_children_quality_revision.py'
      - 'scripts/animated_children_story_writer.py'
      - 'scripts/animated_children_story_diversifier.py'
      - 'scripts/animated_children_subplots.py'
      - 'scripts/animated_children_targeted_distinctions.py'
      - 'scripts/animated_children_french_polish.py'
      - 'scripts/animated_children_source_inspiration.py'
      - 'scripts/animated_children_expansion.py'
      - 'scripts/animated_children_metadata_localization.py'
      - 'scripts/animated_children_final_localization.py'
      - 'scripts/animated_children_pipeline.py'
      - 'data/children/animated/schema.json'
      - 'children-animated.html'
      - 'children.html'
      - 'assets/children-animated.js'
      - '.github/workflows/generate-animated-children-stories.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animated-children-600-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'animated-children-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 600-story fully localized corpus and localization-safe artwork
        run: python scripts/animated_children_pipeline.py
      - name: Run strict 600-story editorial, localization and similarity audit
        run: python scripts/animated_children_pipeline.py --validate-only
      - name: Validate distribution, schema, localization, routes and player contract
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('data/children/animated')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          idx=json.loads((root/'index.json').read_text(encoding='utf-8'))
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          schema=json.loads((root/'schema.json').read_text(encoding='utf-8'))
          assert schema['$id']=='children-animated-story-v2'
          assert m['count']==600 and m['originalCount']==100 and m['addedCount']==500
          assert m['locales']==['ar','en','fr'] and m['localizationComplete']==600
          assert m['ageGroups']=={'5-7':150,'8-10':150,'11-13':150,'14-16':150}
          assert all(v==60 for v in m['categories'].values()) and len(m['categories'])==10
          assert len(m['batches'])==30 and all(len(v)==20 for v in m['batches'].values())
          assert len(idx['items'])==600 and idx['count']==600
          for field in ('id','slug','titleAr','titleEn','titleFr'):
              assert len({x[field] for x in idx['items']})==600,field
          assert status['total']==600 and status['added']==500 and status['ready']==600 and status['published']==600 and status['failed']==0
          assert status['localized']=={'ar':600,'en':600,'fr':600}
          assert status['animatedStoryboard']==600 and status['ttsFallback']==600 and status['nativeVideo']==0
          motifs=set(); expansion=0
          for x in idx['items']:
              p=pathlib.Path(x['path']); assert p.is_file(),p
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['publicationStatus']=='READY'
              assert d['locales']==['ar','en','fr'] and d['localizationStatus']=={'ar':'complete','en':'complete','fr':'complete'}
              assert d['watchMode']=='animated-storyboard' and d['listenMode']=='browser-tts'
              assert d['fictional'] is True and d['historicalClaim'] is False
              assert len(d['scenes'])==10
              assert d['categoryAr'] and d['categoryEn'] and d['categoryFr']
              assert d['readingLevelAr'] and d['readingLevelEn'] and d['readingLevelFr']
              assert d['secondaryTagsAr'] and d['secondaryTagsEn'] and d['secondaryTagsFr']
              assert d['searchTextAr'] and d['searchTextEn'] and d['searchTextFr']
              assert not re.search(r'[\u0600-\u06ff]',d['titleFr']+' '+d['synopsisFr']+' '+d['moralFr']+' '+d['searchTextFr'])
              insp=d['inspirationBasis']; motifs.add(insp['eventPattern'])
              assert insp['motifAr'] and insp['motifEn'] and insp['motifFr']
              assert insp['editorialRuleAr'] and insp['editorialRuleEn'] and insp['editorialRuleFr']
              if int(d['id'].rsplit('-',1)[-1])>100:
                  expansion+=1; assert d['expansionKey'] and d['mission'] and d['stake']
              for c in d['characters']:
                  for k in ('nameAr','nameEn','nameFr','personalityAr','personalityEn','personalityFr','weaknessAr','weaknessEn','weaknessFr','appearanceDescriptionAr','appearanceDescriptionEn','appearanceDescriptionFr','clothingDescriptionAr','clothingDescriptionEn','clothingDescriptionFr'):
                      assert c[k],(d['id'],k)
              assert pathlib.Path(d['cover']['path']).is_file()
              assert '<text' not in pathlib.Path(d['cover']['path']).read_text(encoding='utf-8').lower()
              for s in d['scenes']:
                  for k in ('sceneTitle','sceneTitleEn','sceneTitleFr','settingAr','settingEn','settingFr','visualDescriptionAr','visualDescriptionEn','visualDescriptionFr','narration','narrationEn','narrationFr','dialogueAr','dialogueEn','dialogueFr','emotionalToneAr','emotionalToneEn','emotionalToneFr','animationInstructionsAr','animationInstructionsEn','animationInstructionsFr','illustrationPromptAr','illustrationPromptEn','illustrationPromptFr'):
                      assert s[k],(d['id'],s['sceneNumber'],k)
                  art=pathlib.Path(s['illustration']); assert art.is_file()
                  assert '<text' not in art.read_text(encoding='utf-8').lower()
          assert expansion==500 and len(motifs)==10
          html=pathlib.Path('children-animated.html').read_text(encoding='utf-8')
          js=pathlib.Path('assets/children-animated.js').read_text(encoding='utf-8')
          for required in ['caPlay','caPrev','caNext','caTimeline','caNarration','caSubtitleToggle','caReadToggle','caListen','caFullscreen','caReplay','caSpeed','caPlayerLanguage','caSceneSelect']:
              assert required in html,required
          assert 'speechSynthesis' in js and '600' in html
          assert 'children-animated.html' in pathlib.Path('children.html').read_text(encoding='utf-8')
          print('PASS: 600-story AR/EN/FR editorial/schema/frontend/player/publication contract')
          PY
      - name: Materialize 600-story corpus on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'animated-children-bot'
          git config user.email 'animated-children-bot@users.noreply.github.com'
          git add -- data/children/animated assets/children-animated/covers assets/children-animated/scenes
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize 600 localized animated children stories'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
