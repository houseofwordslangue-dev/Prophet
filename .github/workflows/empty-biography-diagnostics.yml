name: Empty biography diagnostics
on:
  pull_request:
    paths:
      - 'scripts/audit_empty_person_biographies.py'
      - 'scripts/mine_empty_biography_source_articles.py'
      - '.github/workflows/empty-biography-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_empty_person_biographies.py'
      - 'scripts/mine_empty_biography_source_articles.py'
      - '.github/workflows/empty-biography-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Mine existing source articles
        run: python scripts/mine_empty_biography_source_articles.py
      - name: Audit rendered biography coverage
        run: python scripts/audit_empty_person_biographies.py
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: empty-biography-diagnostics
          path: |
            data/editorial/empty_biography_source_candidates.json
            data/editorial/empty_biographies_audit.json
          if-no-files-found: error
      - name: Commit diagnostics on main
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/editorial/empty_biography_source_candidates.json data/editorial/empty_biographies_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit empty biographies and source candidates'
          git push origin HEAD:main
