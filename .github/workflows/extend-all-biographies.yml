name: Extend all biographies source-first

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/extend_all_biographies_source_first.py'
      - '.github/workflows/extend-all-biographies.yml'

permissions:
  contents: write

jobs:
  extend-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extend every biography from verified source material
        run: python scripts/extend_all_biographies_source_first.py

      - name: Validate all-biography extension audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/editorial/all_biographies_extension_audit.json').read_text(encoding='utf-8'))
          assert a['peopleScanned'] > 0
          assert a['peopleWithExtendedSourceContent'] > 0
          assert a['aiOriginalSubstantiveContentPercent'] == 0
          assert a['sourceTruthOverridesCoverageTarget'] is True
          assert a['complete'] is True
          u=json.loads(Path('data/editorial/all_biographies_extension_unresolved.json').read_text(encoding='utf-8'))
          assert u['count'] == a['unresolvedCount']
          print(a)
          PY

      - name: Commit all verified biography extensions
        run: |
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- data/editorial/biography-extensions data/editorial/canonical_biography_extensions.json data/editorial/all_biographies_extension_audit.json data/editorial/all_biographies_extension_unresolved.json
          if git diff --cached --quiet; then
            echo 'No new verified source extensions to commit.'
            exit 0
          fi
          git commit -m 'Extend all biographies with verified source content'
          git pull --rebase origin main || true
          git push origin HEAD:main
