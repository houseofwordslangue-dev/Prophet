name: Reader Player Operations

# Governed by MASTER_OVERRIDING_INSTRUCTION.md.
# Run functional reader/player checks only when reader/player/runtime code changes.
on:
  push:
    paths: &reader_player_paths
      - 'server.py'
      - 'platform_services.py'
      - 'ops_services.py'
      - 'reader.html'
      - 'media.html'
      - 'service-worker.js'
      - 'assets/site-menu.js'
      - 'assets/platform-runtime.js'
      - 'assets/cache-telemetry.js'
      - 'assets/reader-*.js'
      - 'assets/media-*.js'
      - 'assets/universal-player.js'
      - 'assets/adaptive-media.js'
      - 'scripts/build_mirror_manifest.py'
      - 'scripts/replicate_assets.py'
      - 'scripts/build_ocr_coordinates.py'
      - 'scripts/build_timed_transcripts.py'
      - 'scripts/prepare_reader_player_assets.py'
      - 'scripts/build_adaptive_media.py'
      - 'scripts/nightly_reader_player_ops.py'
      - 'tests/test_reader_player_runtime.py'
      - '.github/workflows/reader-player-ops.yml'
  pull_request:
    paths: *reader_player_paths
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax validation
        run: python -m compileall -q server.py platform_services.py ops_services.py scripts tests
      - name: Reader/player regression
        env:
          PM_MEDIA_SYNC_ON_START: '0'
          PM_EPUB_CONVERT_ON_START: '0'
        run: python -m unittest -v tests/test_reader_player_runtime.py
      - name: Mirror manifest audit
        run: python scripts/build_mirror_manifest.py

  nightly-maintenance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safe nightly maintenance
        env:
          PM_MEDIA_SYNC_ON_START: '0'
          PM_EPUB_CONVERT_ON_START: '0'
          PM_NIGHTLY_ASSET_PREP: '0'
        run: python scripts/nightly_reader_player_ops.py
      - name: Upload operations report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-player-ops-report
          path: |
            data/ops/nightly_status.json
            data/ops/regression_status.json
            data/mirror_manifest.json
          if-no-files-found: ignore
