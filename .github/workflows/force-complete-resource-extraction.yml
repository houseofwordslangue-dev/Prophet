name: Force complete resource extraction

# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-complete-resource-extraction.yml'
      - 'scripts/force_complete_resource_extraction.py'
      - 'scripts/source_first_fulltext_resolver.py'
      - 'data/drive_verified_assets_20260822.json'

permissions:
  contents: write

concurrency:
  group: prophet-force-complete-resources
  cancel-in-progress: false

jobs:
  force-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exhaust current verified extraction routes
        run: python scripts/force_complete_resource_extraction.py

      - name: Rebuild final extraction readiness ledger
        run: |
          python scripts/source_first_fulltext_resolver.py
          [ -f scripts/enforce_resource_extraction_readiness.py ] && python scripts/enforce_resource_extraction_readiness.py || true

      - name: Commit materialized resource state
        run: |
          git config user.name 'prophet-resource-bot'
          git config user.email 'prophet-resource-bot@users.noreply.github.com'
          git add -A data/editorial data/ingested_library.json library 2>/dev/null || true
          git add -f private/source_first_resolution.json private/resource_extraction_queue.json private/acquisition_candidates.json private/acquisition_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize force-complete resource extraction state [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
