# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
name: Apply corrected household and family taxonomy

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[governance] apply family taxonomy correction 20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical split
        run: python scripts/apply_family_taxonomy_correction_20260822.py
      - name: Validate unified instructions
        run: |
          python -m py_compile scripts/audit_current_instructions.py scripts/apply_family_taxonomy_correction_20260822.py
          python scripts/audit_current_instructions.py
          python scripts/check_master_governance.py
      - name: Commit corrected taxonomy
        run: |
          git config user.name 'Prophet Site Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add MASTER-OVERRIDING-SITE-INSTRUCTION.md assets/site-menu.js data/content_taxonomy_policy.json scripts/audit_current_instructions.py
          if ! git diff --cached --quiet; then
            git commit -m 'Split الأسرة النبوية from العائلة النبوية [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
