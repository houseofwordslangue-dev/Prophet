# GOVERNED_BY: MASTER-OVERRIDING-SITE-INSTRUCTION.md
name: Package Site For Download

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-site-for-download.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build complete site ZIP
        run: |
          zip -qr Prophet-Muhammad-site-latest.zip . \
            -x '.git/*' \
            -x 'Prophet-Muhammad-site-latest.zip'
      - name: Upload packaged site
        uses: actions/upload-artifact@v4
        with:
          name: Prophet-Muhammad-site-latest
          path: Prophet-Muhammad-site-latest.zip
          if-no-files-found: error
          retention-days: 1
      - name: Record packaging run ID
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .package-run-id
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .package-run-id
          git commit -m 'Record site package workflow run [skip ci]' || exit 0
          git push
