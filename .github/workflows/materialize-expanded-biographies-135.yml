name: Import 135 expanded biographies to GitHub
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/materialize_expanded_biographies_135.py'
      - '.github/workflows/materialize-expanded-biographies-135.yml'
      - 'data/expanded_people_135.json'
  push:
    branches: [main]
    paths:
      - 'scripts/materialize_expanded_biographies_135.py'
      - '.github/workflows/materialize-expanded-biographies-135.yml'
      - 'data/expanded_people_135.json'
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Materialize full biographies locally
        run: python scripts/materialize_expanded_biographies_135.py
      - name: Validate local import
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/editorial/expanded_biographies_135_local_audit.json').read_text(encoding='utf-8'))
          assert a['target']==135 and a['imported']==135 and a['uniqueIds']==135 and a['uniqueNames']==135
          assert a['minimumWords']>=120 and a['sourceCoveragePercent']==100
          assert a['aiOriginalSubstantiveContentPercent']==0
          assert a['runtimeExternalFetchRequired'] is False
          assert a['githubMaterialized'] is True and a['complete'] is True
          print(a)
          PY
      - name: Upload import artifact for PR diagnostics
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: expanded-biographies-135-local
          path: |
            data/expanded_people_135.json
            data/expanded_biographies_135_full.json
            data/editorial/expanded_biographies_135_local_audit.json
      - name: Commit full biography corpus
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/expanded_people_135.json data/expanded_biographies_135_full.json data/editorial/expanded_biographies_135_local_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import full 135 expanded biographies into GitHub'
          git push origin HEAD:main
