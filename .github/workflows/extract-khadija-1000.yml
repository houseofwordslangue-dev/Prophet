name: Extract 1000 Khadija source articles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_khadija_1000_source_articles.py'
      - '.github/workflows/extract-khadija-1000.yml'
      - 'library/works/**'
      - 'data/editorial/drafts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prophet-khadija-1000
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Extract exactly 1000 source-grounded Khadija articles
        run: python scripts/build_khadija_1000_source_articles.py
      - name: Validate source-only publication
        shell: bash
        run: |
          python - <<'PY'
          import json,glob
          a=json.load(open('data/editorial/khadija_1000_audit.json',encoding='utf-8'))
          assert a['target']==1000 and a['extracted']==1000 and a['complete'] is True, a
          files=glob.glob('data/editorial/drafts/2026-08-21/khadija-batch-*.json')
          rows=[]
          for f in files: rows += json.load(open(f,encoding='utf-8'))['items']
          assert len(rows)==1000
          assert len({x['id'] for x in rows})==1000
          assert all(x['sourceCoveragePercent']==100 for x in rows)
          assert all(x['aiOriginalSubstantiveContentPercent']==0 for x in rows)
          assert all(x['duplicateCheck']=='PASS' and x['provenanceStatus']=='PASS' for x in rows)
          assert all(any(k in p['text'].lower() for k in ('خديجة','خديجه','khadija','khadijah','khadidja','khadeeja','khadîdja','bint khuwaylid','bint khuwailid')) for x in rows for p in x['paragraphs'])
          print('PASS: 1000 source-only Khadija articles')
          PY
      - name: Commit extracted publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prophet-editorial-bot'
          git config user.email 'prophet-editorial-bot@users.noreply.github.com'
          git add -- data/editorial/khadija_1000_audit.json data/editorial/publication_supplement.json data/editorial/drafts/2026-08-21/khadija-batch-*.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Publish 1000 Khadija source articles'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
