<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>مكتبة الوسائط — محمد ﷺ</title>
<meta name="description" content="مكتبة فيديو وصوت ومحاضرات ووثائقيات مع تشغيل داخل الموقع، بحث، قوائم موضوعية، ومتابعة المواد ذات الصلة.">
<link rel="stylesheet" href="assets/tarjma-fonts.css">

</head>
<body>
<header class="media-head">
  <a class="media-brand" href="index.html">محمد ﷺ</a>
  <form id="mediaSearchForm" class="media-search" role="search"><input id="mediaSearch" type="search" placeholder="ابحث في مكتبة الوسائط" aria-label="بحث في الوسائط"><button type="submit">بحث</button></form>
  <nav><a href="library.html">المكتبة</a><a href="editorial.html">المقالات</a></nav>
</header>
<main>
<section class="media-shell">
  <aside class="media-sidebar" aria-label="تصفح الوسائط">
    <button type="button" class="active" data-media-filter="">الكل</button>
    <button type="button" data-media-filter="video">الفيديوهات</button>
    <button type="button" data-media-filter="lecture">المحاضرات</button>
    <button type="button" data-media-filter="documentary">الوثائقيات</button>
    <button type="button" data-media-filter="podcast">البودكاست</button>
    <button type="button" data-media-filter="audio">الصوتيات</button>
    <button type="button" data-media-filter="research">الأبحاث المرئية</button>
    <hr>
    <a href="library.html">الكتب</a>
    <a href="references.html">المصادر والدراسات</a>
  </aside>
  <div class="media-main">
    <section class="hero"><div><p class="eyebrow">مكتبة مشاهدة واستماع</p><h1>الوسائط</h1><p>مشغل داخلي للفيديو والصوت، مع بحث وتصنيف ومواد ذات صلة. تستخدم النسخة المحلية عندما تتوفر، وإلا يستخدم تضمينًا عامًا صالحًا للتشغيل.</p></div><div id="mediaStatus">جار تحميل الفهرس…</div></section>
    <section id="mediaCounts" class="counts"></section>
    <section class="layout">
      <div class="watch-column">
        <div id="mediaPlayer" class="player"><div class="empty">اختر مادة لتشغيلها</div></div>
        <div id="mediaNow" class="now"></div>
        <div class="watch-actions"><button id="mediaPrev" type="button">السابق</button><button id="mediaNext" type="button">التالي</button><button id="mediaCopy" type="button">نسخ رابط المادة</button></div>
        <section class="related"><h2>مواد ذات صلة</h2><div id="relatedGrid" class="related-grid"></div></section>
      </div>
      <div class="browse-column">
        <div class="browse-toolbar"><select id="mediaFilter" aria-label="التصنيف"><option value="">جميع التصنيفات</option><option value="video">فيديوهات</option><option value="lecture">محاضرات</option><option value="podcast">بودكاست</option><option value="research">أبحاث</option><option value="documentary">وثائقيات</option><option value="audio">صوتيات</option></select><select id="mediaSort" aria-label="الترتيب"><option value="newest">الأحدث</option><option value="views">الأكثر مشاهدة</option><option value="title">العنوان</option></select></div>
        <div id="mediaGrid" class="grid"></div>
      </div>
    </section>
  </div>
</section>
</main>
