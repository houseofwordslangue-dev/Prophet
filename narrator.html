<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>السير والتراجم — محمد ﷺ</title>
<script>
(function(){
  const old=new URLSearchParams(location.search),next=new URLSearchParams();
  next.set('rijal','1');
  for(const key of ['id','g','group','s','p','lang']) if(old.has(key)) next.set(key,old.get(key));
  if(!next.has('group')) next.set('group','rijal');
  location.replace('person.html?'+next.toString());
})();
</script>
</head>
<body><p>جارٍ الانتقال إلى السيرة الشخصية ضمن السير والتراجم…</p></body>
</html>
