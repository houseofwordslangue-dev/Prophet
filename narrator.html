<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ترجمة الراوي | محمد ﷺ</title><link rel="stylesheet" href="assets/tarjma-fonts.css"><link rel="stylesheet" href="assets/site-professional.css"><style>
:root{--g:#0b4c38;--cream:#f6f0e3;--paper:#fffdf7;--line:#d9cfbb;--text:#1d2e28;--muted:#6c685f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Tahoma,'Noto Naskh Arabic',Arial,sans-serif}header{background:var(--g);color:#fff;padding:15px;position:sticky;top:0;z-index:10}.wrap{max-width:1050px;margin:auto}.top{display:flex;align-items:center;gap:12px}.top a{color:#fff;text-decoration:none;font-weight:700}.grow{flex:1}.hero,.section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:15px 0}.hero h1{margin:0;color:var(--g);font-size:28px}.sub,.muted{color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:14px}.fact{background:#fff;border:1px solid #e4dccd;border-radius:10px;padding:10px}.fact b,.section h2{color:var(--g)}.arabic{font-size:17px;line-height:2}.variant{display:inline-block;border:1px solid #ddd3c0;background:#fff;padding:4px 8px;border-radius:16px;margin:3px}.opinion{border-right:3px solid #b69b61;padding:8px 12px;margin:8px 0;background:#fff}.src{padding:8px;border-bottom:1px solid #eee5d6;line-height:1.8}.raw{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.8}.notice{padding:12px;border-radius:10px;background:#edf4ef;margin-top:12px;line-height:1.7}</style></head><body><header><div class="wrap top"><a id="back" href="followers.html">← التابعون</a><div class="grow"></div><a href="index.html">الرئيسية</a></div></header><main class="wrap"><div id="view"><section class="hero">جارٍ تحميل الترجمة من المصدر…</section></div></main><script>
const REMOTE='https://r3genesi5.github.io/Itqan/app/data/rijal/',LOCAL='data/rijal/';const qs=new URLSearchParams(location.search),target=decodeURIComponent(qs.get('id')||''),grade=qs.get('g')||'',group=qs.get('group')||'',shard=qs.get('s')||'';if(group)document.getElementById('back').href='people.html?group='+encodeURIComponent(group);
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m));const meaningful=v=>v!==undefined&&v!==null&&v!==''&&!(Array.isArray(v)&&!v.length)&&!(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
function sec(title,html){return html?`<section class="section"><h2>${title}</h2>${html}</section>`:''}function renderObject(o){if(!o||typeof o!=='object')return esc(o);return Object.entries(o).filter(([,v])=>meaningful(v)).map(([k,v])=>`<b>${esc(k)}</b>: ${Array.isArray(v)?esc(v.join(' · ')):typeof v==='object'?esc(JSON.stringify(v,null,1)):esc(v)}`).join('<br>')}function renderSources(v){if(!meaningful(v))return '';if(Array.isArray(v))return v.map(x=>`<div class="src">${typeof x==='string'?esc(x):renderObject(x)}</div>`).join('');if(typeof v==='object')return Object.entries(v).map(([k,x])=>`<div class="src"><b>${esc(k)}</b>: ${typeof x==='object'?renderObject(x):esc(x)}</div>`).join('');return `<div class="src">${esc(v)}</div>`}
function render(p){document.title=(p.full_name||p.name_ar||p.name||'ترجمة الراوي')+' | محمد ﷺ';const namings=arr(p.namings||p.name_variants||p.aliases);let html=`<section class="hero"><h1>${esc(p.full_name||p.name_ar||p.name||'غير مسمى')}</h1><div class="sub">${esc(p.kunya||'')} ${p.laqab?' · '+esc(p.laqab):''}</div><div class="notice">هذه الترجمة تعرض فقط الحقول والمراجع الموجودة في السجل المصدر؛ لا تُنشأ تفاصيل لسد الفراغات.</div><div class="facts">${p.nasab?`<div class="fact"><b>النسب</b>${esc(p.nasab)}</div>`:''}${p.grade_ar||p.grade_en?`<div class="fact"><b>التوصيف</b>${esc(p.grade_ar||p.grade_en)}</div>`:''}${p.tabaqat||p.tabaqa||p.generation?`<div class="fact"><b>الطبقة</b>${esc(p.tabaqat||p.tabaqa||p.generation)}</div>`:''}${p.city||p.place||p.residence?`<div class="fact"><b>البلد/الإقامة</b>${esc(p.city||p.place||p.residence)}</div>`:''}${p.birth||p.birth_year?`<div class="fact"><b>الميلاد</b>${esc(p.birth||p.birth_year)}</div>`:''}${p.death||p.death_year?`<div class="fact"><b>الوفاة</b>${esc(p.death||p.death_year)}</div>`:''}</div></section>`;html+=sec('صيغ الاسم والكنى',namings.length?'<div>'+namings.map(n=>`<span class="variant">${esc(n)}</span>`).join('')+'</div>':'');html+=sec('التقييمات المنقولة',p.dhahabi?`<div class="arabic">${esc(p.dhahabi)}</div>`:'');if(p.jarh_wa_tadil&&typeof p.jarh_wa_tadil==='object')html+=sec('أقوال النقاد',Object.entries(p.jarh_wa_tadil).map(([s,o])=>`<div class="opinion"><b>${esc(s)}</b><div class="arabic">${typeof o==='object'?renderObject(o):esc(o)}</div></div>`).join(''));for(const [title,keys] of [['الشيوخ والرواية عمّن',['teachers','narrated_from','shuyukh']],['التلاميذ ومن روى عنه',['students','narrated_to','talabah']],['العلاقات والروابط',['relations','relationships','family']],['المصادر والمراجع',['sources','source_refs','classical_sources','source_entries']]]){let vals=[];for(const k of keys)if(meaningful(p[k]))vals.push(p[k]);if(vals.length)html+=sec(title,vals.map(renderSources).join(''))}const shown=new Set(['id','key','full_name','name_ar','name','kunya','laqab','nasab','nisba','grade_ar','grade_en','grade','tabaqat','tabaqa','generation','city','place','residence','birth','birth_year','death','death_year','namings','name_variants','aliases','alternate_names','dhahabi','jarh_wa_tadil','teachers','narrated_from','shuyukh','students','narrated_to','talabah','relations','relationships','family','sources','source_refs','classical_sources','source_entries','source_partition','generation_group','source_record']);const extra=Object.entries(p).filter(([k,v])=>!shown.has(k)&&meaningful(v));if(extra.length)html+=sec('بيانات ترجميّة إضافية متاحة',`<div class="raw">${extra.map(([k,v])=>`<b>${esc(k)}</b>: ${typeof v==='object'?esc(JSON.stringify(v,null,2)):esc(v)}`).join('\n\n')}</div>`);document.getElementById('view').innerHTML=html}
function findRecord(d){const vals=Array.isArray(d)?d:Object.values(d||{});return vals.find(x=>String(x.id||x.key||x.global_id||x.full_name||x.name_ar||x.name)===target||String(x.full_name||x.name_ar||x.name)===target)}
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(u);return r.json()}
async function load(){if(shard){try{const p=findRecord(await getJSON('data/generations/'+shard));if(p){render(p);return}}catch(e){}}for(const base of [LOCAL,REMOTE]){try{const m=await getJSON(base+'manifest.json');let files=(m.files||[]).filter(f=>f.type==='profiles');if(grade){const same=files.filter(f=>f.grade===grade);if(same.length)files=same}for(const f of files){const p=findRecord(await getJSON(base+f.name));if(p){render(p);return}}}catch(e){}}document.getElementById('view').innerHTML='<section class="hero">تعذر العثور على هذه الترجمة في قاعدة المصادر.</section>'}load();
</script></body></html>
