<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المكتبة الكاملة</title><style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Naskh Arabic",serif;background:#f7f5ef;color:#17352b}header{position:sticky;top:0;z-index:3;background:#123d31;color:#fff;padding:18px 5vw;box-shadow:0 2px 12px #0002}h1{margin:0 0 8px;font-size:clamp(24px,4vw,42px)}header p{margin:0;opacity:.9}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;padding:18px 5vw;background:#eee8dc}.tools input,.tools select{width:100%;padding:12px;border:1px solid #b9ae98;border-radius:10px;background:white;color:#17352b}.stats{padding:0 5vw 15px;color:#5c4f39}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding:0 5vw 50px}.card{background:white;border:1px solid #ded6c7;border-radius:14px;padding:16px;box-shadow:0 3px 13px #0000000d}.card h2{font-size:20px;margin:0 0 8px}.meta{font-size:14px;color:#675f51}.badge{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#eee8dc;font-size:12px}.full{background:#dcefe5;color:#174c38}.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.links a{padding:7px 10px;border-radius:8px;background:#123d31;color:#fff;text-decoration:none;font-size:13px}.links a.secondary{background:#6a624f}.notice{padding:14px 5vw;background:#fff4d6;color:#604d18;border-block:1px solid #ead28a}@media(max-width:700px){.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){body{background:#10201b;color:#e9eee8}.tools{background:#193027}.card{background:#172a23;border-color:#395148}.meta{color:#bfc8c2}.tools input,.tools select{background:#14251f;color:#fff;border-color:#456357}.notice{background:#3a321c;color:#f5e5a7;border-color:#66572d}}</style></head><body><header><h1>المكتبة الكاملة</h1><p>فهرس موحّد لجميع المصادر المسجّلة، مع فتح النسخ الموثقة في القارئ الداخلي.</p></header><div class="notice">جميع سجلات المكتبة تظهر هنا. تُفعّل القراءة والبحث والاستماع فقط عندما توجد نسخة عامة موثقة؛ أما بقية السجلات فتبقى متاحة للفهرسة والبحث مع بيان حالتها الحقيقية.</div><section class="tools"><input id="q" type="search" placeholder="ابحث في العنوان أو المؤلف أو المعرّف"><select id="cat"><option value="">جميع الأقسام</option></select><select id="access"><option value="">جميع حالات الإتاحة</option><option value="PUBLIC_FULL_TEXT">نص كامل متاح</option><option value="CATALOG_ONLY_RIGHTS_PENDING">نسخة محلية؛ الإتاحة العامة معلقة</option><option value="CATALOG_ONLY_LOCAL_ASSET_PENDING">المصدر موثق؛ النسخة المحلية معلقة</option><option value="CATALOG_ONLY_SOURCE_READY_LIMITED">المصدر جاهز جزئياً</option><option value="CATALOG_ONLY_RIGHTS_UNVERIFIED_OR_RESTRICTED">فهرسة فقط</option><option value="CATALOG_ONLY_SOURCE_OR_ASSET_PENDING">قيد الاستكمال</option><option value="CATALOGUED">مدرج في المكتبة</option></select></section><div class="stats" id="stats">جارٍ تحميل الفهرس…</div><main class="grid" id="grid"></main><script>const labels={PUBLIC_FULL_TEXT:'نص كامل متاح',CATALOG_ONLY_RIGHTS_PENDING:'نسخة محلية؛ الإتاحة العامة معلقة',CATALOG_ONLY_LOCAL_ASSET_PENDING:'المصدر موثق؛ النسخة المحلية معلقة',CATALOG_ONLY_SOURCE_READY_LIMITED:'المصدر جاهز جزئياً',CATALOG_ONLY_RIGHTS_UNVERIFIED_OR_RESTRICTED:'فهرسة فقط',CATALOG_ONLY_SOURCE_OR_ASSET_PENDING:'قيد الاستكمال',CATALOGUED:'مدرج في المكتبة'};let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const enc=s=>encodeURIComponent(String(s??''));function inferState(r){const s=String(r[14]||r[10]||'');if(s.includes('source-ready-limited'))return'CATALOG_ONLY_SOURCE_READY_LIMITED';if(r[12])return'CATALOG_ONLY_SOURCE_OR_ASSET_PENDING';return'CATALOGUED'}function compact(r){return{id:r[0],entryNumber:r[1],category:r[2]||'غير مصنف',title:r[3]||r[4]||r[0],author:r[5]||r[6]||'',kind:r[7]||'',rights:r[8]||'',state:r[14]||r[10]||'',sourceUrl:r[12]||'',notes:r[13]||'',catalogueVisible:true,access:inferState(r)}}function merge(base,overlay){const m=new Map();base.forEach(x=>m.set(String(x.id),x));overlay.forEach(x=>{const k=String(x.id);const b=m.get(k)||{};m.set(k,{...b,...x,title:x.title||b.title,author:x.author||b.author,category:x.category||b.category,sourceUrl:(x.sources&&x.sources[0])||x.sourceUrl||b.sourceUrl})});return[...m.values()]}function draw(){const query=q.value.trim().toLowerCase(),c=cat.value,a=access.value;const rows=all.filter(x=>(!query||[x.title,x.author,x.id,x.category].join(' ').toLowerCase().includes(query))&&(!c||x.category===c)&&(!a||x.access===a));stats.textContent=`${rows.length} من ${all.length} مصدراً في المكتبة`;grid.innerHTML=rows.map(x=>{const src=(x.sources&&x.sources[0])||x.sourceUrl||'';const readable=x.access==='PUBLIC_FULL_TEXT'&&src;const reader=readable?`reader.html?id=${enc(x.id)}&src=${enc(src)}&title=${enc(x.title)}&return=${enc('library-all.html')}`:'';return`<article class="card"><h2>${esc(x.title)}</h2><div class="meta">${esc(x.author||'—')}<br>${esc(x.category||'—')}<br><code>${esc(x.id)}</code></div><span class="badge ${x.access==='PUBLIC_FULL_TEXT'?'full':''}">${esc(labels[x.access]||x.access||'مدرج في المكتبة')}</span><div class="links">${reader?`<a href="${reader}">قراءة في القارئ</a>`:''}${src?`<a class="secondary" href="${esc(src)}" target="_blank" rel="noopener noreferrer">المصدر الموثق</a>`:''}</div></article>`}).join('')||'<p>لا توجد نتائج.</p>'}async function load(){try{const overlayP=fetch('data/public_catalog_all.generated.json',{cache:'no-store'}).then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]}));const chunkPs=Array.from({length:14},(_,i)=>fetch(`data/catalogue/chunk-${String(i+1).padStart(2,'0')}.json`,{cache:'no-store'}).then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]})));const [overlay,...chunks]=await Promise.all([overlayP,...chunkPs]);const baseline=chunks.flatMap(d=>(d.items||[]).map(compact));all=merge(baseline,overlay.items||[]).sort((a,b)=>(Number(a.entryNumber)||999999)-(Number(b.entryNumber)||999999)||String(a.title).localeCompare(String(b.title),'ar'));[...new Set(all.map(x=>x.category).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ar')).forEach(v=>cat.add(new Option(v,v)));draw()}catch(e){console.error(e);stats.textContent='تعذر تحميل بيانات الفهرس.'}}[q,cat,access].forEach(el=>el.addEventListener('input',draw));load();</script></body></html>
