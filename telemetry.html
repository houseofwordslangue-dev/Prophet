<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة أداء القارئ والمشغل</title><link rel="stylesheet" href="assets/tarjma-fonts.css"><link rel="stylesheet" href="assets/platform-runtime.css"><link rel="stylesheet" href="assets/site-professional.css"><style>body{margin:0;background:#f6f7f3;color:#17261f;font-family:var(--font-arabic,system-ui)}main{width:min(1180px,92vw);margin:40px auto}.dash-head{display:flex;justify-content:space-between;gap:20px;align-items:end}.dash-head h1{margin:0}.dash-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}.metric,.panel{background:white;border:1px solid #dfe5df;border-radius:16px;padding:18px;box-shadow:0 10px 28px #173b2d0b}.metric strong{display:block;font-size:2rem;color:#0b4c38}.metric span{color:#69756f}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.event-list{display:grid;gap:8px}.event-list div{display:flex;justify-content:space-between;border-bottom:1px solid #eef1ed;padding:7px}.table{width:100%;border-collapse:collapse;font-size:.85rem}.table th,.table td{text-align:right;padding:8px;border-bottom:1px solid #edf0ed;vertical-align:top}@media(max-width:900px){.dash-grid{grid-template-columns:1fr 1fr}.panels{grid-template-columns:1fr}}</style></head><body><main><header class="dash-head"><div><p>Reader / Player Operations</p><h1>لوحة الأداء</h1></div><button id="refresh">تحديث</button></header><section class="dash-grid"><article class="metric"><strong id="events">—</strong><span>أحداث مسجلة</span></article><article class="metric"><strong id="startup">—</strong><span>متوسط بدء الصفحة ms</span></article><article class="metric"><strong id="buffer">—</strong><span>متوسط التخزين المؤقت ms</span></article><article class="metric"><strong id="search">—</strong><span>متوسط البحث ms</span></article><article class="metric"><strong id="cacheRate">—</strong><span>نسبة إصابة الذاكرة المؤقتة</span></article></section><section class="panels"><article class="panel"><h2>الأحداث</h2><div id="byEvent" class="event-list"></div></article><article class="panel"><h2>آخر القياسات</h2><div style="overflow:auto"><table class="table"><thead><tr><th>الحدث</th><th>المسار</th><th>القيمة</th><th>الوقت</th></tr></thead><tbody id="lastRows"></tbody></table></div></article></section></main><script src="assets/telemetry-dashboard.js"></script><script src="assets/site-menu.js"></script></body></html>
